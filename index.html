<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vision X - Internal Testing Build</title>
    
    <!-- Leaflet & Routing -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        
        /* Premium Glassmorphism UI */
        .hud-container {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 1000;
            width: 95%; max-width: 450px; display: flex; flex-direction: column; gap: 15px; pointer-events: none;
        }

        .panel {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px;
            padding: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); pointer-events: auto;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        .logo { color: #fff; font-size: 16px; font-weight: bold; letter-spacing: 1px; }
        .status { color: #22c55e; font-size: 10px; font-weight: bold; letter-spacing: 1px; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 2s infinite; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        /* Input Fields */
        .input-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 15px; }
        input {
            width: 100%; padding: 12px; border-radius: 6px; border: 1px solid rgba(56, 189, 248, 0.3);
            background: rgba(0, 0, 0, 0.5); color: #38bdf8; font-size: 14px; outline: none;
        }
        input::placeholder { color: #64748b; }
        
        button.primary-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #1d4ed8);
            color: #fff; border: none; border-radius: 6px; font-size: 14px; font-weight: bold;
            cursor: pointer; letter-spacing: 1px; text-transform: uppercase;
        }

        /* Toggles */
        .layer-controls { display: flex; gap: 10px; justify-content: space-between; }
        .layer-btn {
            flex: 1; padding: 8px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #94a3b8; border-radius: 4px; font-size: 10px; font-weight: bold; cursor: pointer;
        }
        .layer-btn.active { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; color: #22c55e; }

        /* Hide Default Routing Box for clean look */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-container">
        <div class="panel">
            <div class="header">
                <div class="logo">VISION X // OS</div>
                <div class="status"><div class="dot"></div> SYSTEM ONLINE</div>
            </div>

            <div class="input-group">
                <input type="text" id="start-input" placeholder="Origin (e.g. Islamabad)">
                <input type="text" id="end-input" placeholder="Destination (e.g. Abbottabad)">
            </div>

            <button class="primary-btn" id="route-btn">INITIATE ROUTE</button>
        </div>

        <!-- Simulated Data Layers for Investor Pitch -->
        <div class="panel" style="padding: 10px 15px;">
            <div class="layer-controls">
                <button class="layer-btn active" id="btn-sat">SATELLITE</button>
                <button class="layer-btn" id="btn-traffic" onclick="toggleLayer('btn-traffic')">TRAFFIC AI</button>
                <button class="layer-btn" id="btn-weather" onclick="toggleLayer('btn-weather')">WEATHER</button>
            </div>
        </div>
    </div>

    <script>
        // 1. Initialize Map on Islamabad
        const map = L.map('map', { zoomControl: false }).setView([33.6844, 73.0479], 14);

        // 2. High-Res Satellite View (Zoom Level 21)
        L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}', {
            maxZoom: 21,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        // 3. Routing Engine
        let routingControl = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true,
            lineOptions: {
                styles: [{ color: '#0ea5e9', opacity: 0.8, weight: 6 }]
            },
            createMarker: function(i, waypoint, n) {
                return L.marker(waypoint.latLng, { draggable: true });
            }
        }).addTo(map);

        // Simple testing database
        const coords = {
            'islamabad': [33.6844, 73.0479],
            'abbottabad': [34.1463, 73.2117],
            'lahore': [31.5204, 74.3587],
            'karachi': [24.8607, 67.0011]
        };

        // 4. Action Button
        document.getElementById('route-btn').addEventListener('click', () => {
            const btn = document.getElementById('route-btn');
            btn.innerText = "CALCULATING...";
            
            setTimeout(() => {
                const start = document.getElementById('start-input').value.toLowerCase().trim();
                const end = document.getElementById('end-input').value.toLowerCase().trim();
                
                const startCoord = coords[start] || [33.6844, 73.0479];
                const endCoord = coords[end] || [34.1463, 73.2117];

                routingControl.setWaypoints([
                    L.latLng(startCoord[0], startCoord[1]),
                    L.latLng(endCoord[0], endCoord[1])
                ]);
                
                btn.innerText = "ROUTE LOCKED";
                btn.style.background = "linear-gradient(135deg, #22c55e, #16a34a)";
                
                setTimeout(() => {
                    btn.innerText = "INITIATE ROUTE";
                    btn.style.background = "linear-gradient(135deg, #0284c7, #1d4ed8)";
                }, 3000);
            }, 1000);
        });

        // Toggle Buttons (Visual feedback for testing)
        function toggleLayer(id) {
            const btn = document.getElementById(id);
            btn.classList.toggle('active');
            // This is where real API layers would toggle on/off in the future
        }
    </script>
</body>
</html>
