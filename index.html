<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEGIS-X CENTURY 3D GLOBE - CORE OS</title>
    
    <!-- Enterprise Grade 3D Spatial Engine (CesiumJS) -->
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.108/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <style>
        :root {
            --hud-bg: rgba(2, 6, 23, 0.92);
            --hud-cyan: #38bdf8;
            --hud-border: rgba(56, 189, 248, 0.4);
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: var(--font-mono); }

        #cesiumContainer { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Hide Default Cesium UI Controls for Clean Futuristic Look */
        .cesium-viewer-animationContainer, .cesium-viewer-timelineContainer, 
        .cesium-viewer-bottom, .cesium-navigationHelpButton-wrapper,
        .cesium-viewer-geocoderContainer { display: none !important; }

        /* Tactical HUD Canvas Layer */
        .hud-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
        }

        .hud-top { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; max-width: 500px; margin: 0 auto; }

        .search-box {
            background: var(--hud-bg); backdrop-filter: blur(20px);
            border: 1px solid var(--hud-cyan); border-radius: 6px; padding: 6px 10px;
            display: flex; gap: 8px; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .search-field {
            flex: 1; background: transparent; border: none; outline: none; color: #38bdf8; font-size: 13px; font-weight: bold; font-family: var(--font-mono);
        }

        .action-btn {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); border: none; border-radius: 4px;
            padding: 6px 16px; color: white; font-weight: bold; font-size: 10px; letter-spacing: 1px; cursor: pointer;
        }

        .telemetry-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .tele-panel {
            background: var(--hud-bg); backdrop-filter: blur(15px);
            border: 1px solid var(--hud-border); border-radius: 6px; padding: 6px 10px;
        }

        .tele-title { color: #38bdf8; font-size: 7.5px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .tele-data { color: #ffffff; font-size: 11px; font-weight: bold; margin-top: 2px; }

        /* Live Scanning Radar Display */
        .radar-box {
            position: absolute; bottom: 80px; right: 20px; width: 90px; height: 90px;
            border-radius: 50%; border: 1px solid rgba(56, 189, 248, 0.4);
            background: radial-gradient(circle, rgba(2,6,23,0.3) 0%, rgba(2,6,23,0.9) 80%);
            z-index: 1001; pointer-events: none; overflow: hidden;
        }
        .radar-sweep {
            width: 100%; height: 100%;
            background: conic-gradient(from 0deg, rgba(56, 189, 248, 0.5) 0deg, transparent 60deg);
            border-radius: 50%; animation: radar-spin 2s linear infinite;
        }
        @keyframes radar-spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hud-bottom { display: flex; gap: 6px; pointer-events: auto; width: 100%; max-width: 500px; margin: 0 auto; }
        .nav-btn {
            flex: 1; padding: 12px 2px; border-radius: 6px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid var(--hud-border); color: #38bdf8; font-weight: bold; font-size: 8.5px;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; text-align: center;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <!-- 3D Globe Container -->
    <div id="cesiumContainer"></div>

    <!-- Live Tactical Radar -->
    <div class="radar-box">
        <div class="radar-sweep"></div>
    </div>

    <!-- Interface HUD Canvas -->
    <div class="hud-wrapper">
        <div class="hud-top">
            <div class="search-box">
                <input type="text" class="search-field" id="target-input" placeholder="ENTER LOCATION (e.g. Islamabad, Vancouver)...">
                <button class="action-btn" id="lock-btn">LOCK</button>
            </div>

            <div class="telemetry-bar">
                <div class="tele-panel">
                    <div class="tele-title">SYS TIME / STATUS</div>
                    <div class="tele-data" id="sys-time">00:00:00 UTC</div>
                </div>
                <div class="tele-panel" style="text-align: right;">
                    <div class="tele-title">COORDINATES / ALTITUDE</div>
                    <div class="tele-data" id="coord-display">33.70, 73.06 | 1000km</div>
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <button class="nav-btn active" id="btn-globe">3D ORBIT</button>
            <button class="nav-btn" id="btn-street">STREET TARGET</button>
            <button class="nav-btn" id="btn-grid">MATRIX GRID</button>
        </div>
    </div>

    <script>
        // Initialize Cesium 3D Globe Engine
        const viewer = new Cesium.Viewer('cesiumContainer', {
            imageryProvider: new Cesium.UrlTemplateImageryProvider({
                url: 'https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', // HD Hybrid Satellite Layer
                maximumLevel: 20
            }),
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            infoBox: false,
            sceneModePicker: false,
            selectionIndicator: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false,
            fullscreenButton: false
        });

        // Set Initial Camera View over Global Coordinates
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(73.06, 33.70, 15000000.0) // 3D Planetary Orbit View
        });

        // Live Clock Update
        setInterval(() => {
            document.getElementById('sys-time').innerText = new Date().toUTCString().split(' ')[4] + ' UTC';
        }, 1000);

        // Real-Time Position & Altitude Telemetry
        viewer.camera.changed.addEventListener(() => {
            const cartographic = Cesium.Cartographic.fromCartesian(viewer.camera.position);
            const lat = Cesium.Math.toDegrees(cartographic.latitude).toFixed(2);
            const lon = Cesium.Math.toDegrees(cartographic.longitude).toFixed(2);
            const alt = (cartographic.height / 1000).toFixed(0);
            document.getElementById('coord-display').innerText = `${lat}, ${lon} | ${alt}KM`;
        });

        // High Precision Search Lock with Smooth 3D Camera Flight (Orbit -> Street Level Zoom)
        function executeSearch() {
            const query = document.getElementById('target-input').value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(r => r.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        // Smooth 3D Cinematic Fly-To Action down to 800 Meters
                        viewer.camera.flyTo({
                            destination: Cesium.Cartesian3.fromDegrees(lon, lat, 800.0),
                            duration: 3.5,
                            pitchAdjustHeight: 1000
                        });

                        // Add Target Marker Point
                        viewer.entities.removeAll();
                        viewer.entities.add({
                            position: Cesium.Cartesian3.fromDegrees(lon, lat),
                            point: { pixelSize: 12, color: Cesium.Color.CYAN, outlineColor: Cesium.Color.WHITE, outlineWidth: 2 }
                        });
                    }
                });
        }

        document.getElementById('lock-btn').addEventListener('click', executeSearch);
        document.getElementById('target-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') executeSearch(); });

        // Navigation Mode Switching
        document.getElementById('btn-globe').addEventListener('click', () => {
            const cartographic = Cesium.Cartographic.fromCartesian(viewer.camera.position);
            viewer.camera.flyTo({
                destination: Cesium.Cartesian3.fromDegrees(
                    Cesium.Math.toDegrees(cartographic.longitude),
                    Cesium.Math.toDegrees(cartographic.latitude),
                    12000000.0
                ),
                duration: 2.0
            });
        });

        // Silent Background Telemetry Analytics Engine
        setInterval(() => {
            fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson')
                .then(r => r.json()).then(() => {}).catch(() => {});
        }, 30000);
    </script>
</body>
</html>
