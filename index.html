<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AegisX - 100Y Quantum Military & Spatial Intelligence System</title>
    
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010409; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #020617; }

        /* Military Sci-Fi HUD Overlay */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
        }
        
        .top-panel { display: flex; flex-direction: column; gap: 10px; pointer-events: auto; }

        .search-box-container {
            background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 16px; padding: 12px 16px;
            display: flex; gap: 10px; box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 14px; font-weight: 700;
        }
        .search-input::placeholder { color: #475569; }
        
        .search-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 12px;
            padding: 0 16px; color: white; font-weight: 900; font-size: 11px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.7);
        }

        .telemetry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .telemetry-card {
            background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; padding: 12px 14px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .label-glow { color: #38bdf8; font-size: 9px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 0 10px rgba(56,189,248,0.7); }
        .val-display { color: #ffffff; font-size: 18px; font-weight: 900; font-family: monospace; margin-top: 2px; }
        .pulse-core { width: 7px; height: 7px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 12px #4ade80; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }

        /* Military Radar HUD Effect */
        .radar-box {
            position: absolute; bottom: 90px; right: 15px; width: 110px; height: 110px;
            background: rgba(3, 7, 18, 0.85); border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 50%;
            pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 0 25px rgba(2,132,199,0.4);
        }
        .radar-sweep {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0) 0deg, rgba(56, 189, 248, 0.4) 360deg);
            animation: rotateRadar 4s linear infinite;
        }
        @keyframes rotateRadar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-center { width: 4px; height: 4px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; z-index: 2; }

        .control-bar { display: flex; gap: 10px; pointer-events: auto; width: 100%; max-width: 420px; margin: 0 auto; }
        .quantum-btn {
            flex: 1; padding: 14px; border: none; border-radius: 14px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; font-weight: 900; font-size: 10px;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer;
        }
        .quantum-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.7);
        }

        .leaflet-bar { border: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Military Radar Widget -->
    <div class="radar-box">
        <div class="radar-sweep"></div>
        <div class="radar-center"></div>
    </div>

    <div class="hud-overlay">
        <div class="top-panel">
            <div class="search-box-container">
                <input type="text" class="search-input" id="global-search" placeholder="Enter sector, country, or coordinates...">
                <button class="search-btn" id="exec-btn">EXECUTE</button>
            </div>

            <div class="telemetry-grid">
                <div class="telemetry-card">
                    <div class="label-glow"><span class="pulse-core"></span>INTELLIGENCE CORE</div>
                    <div class="val-display" id="status-display" style="font-size: 11px; color: #38bdf8; margin-top: 4px;">SYSTEM SYNCED</div>
                </div>
                <div class="telemetry-card" style="text-align: right;">
                    <div class="label-glow">VELOCITY VECTOR</div>
                    <div class="val-display" id="velocity-val">0.0 KM/H</div>
                </div>
            </div>
        </div>

        <div class="control-bar">
            <button class="quantum-btn active" id="btn-sat">SATELLITE INTEL</button>
            <button class="quantum-btn" id="btn-matrix">CYBER MATRIX</button>
        </div>
    </div>

    <script>
        // Initialize Advanced Spatial Map Core (Centered on Pakistan by default)
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([30.3753, 69.3451], 5);

        // Cyber Matrix Theme Layer
        const matrixTiles = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19
        }).addTo(map);

        // Military Grade High-Res Satellite Imagery Layer
        const satTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        });

        // Layer Switchers
        document.getElementById('btn-matrix').addEventListener('click', () => {
            document.getElementById('btn-matrix').classList.add('active');
            document.getElementById('btn-sat').classList.remove('active');
            map.removeLayer(satTiles);
            matrixTiles.addTo(map);
        });

        document.getElementById('btn-sat').addEventListener('click', () => {
            document.getElementById('btn-sat').classList.add('active');
            document.getElementById('btn-matrix').classList.remove('active');
            map.removeLayer(matrixTiles);
            satTiles.addTo(map);
        });

        let targetMarker = null;

        // Global Geocoding & Military Target Locking Engine
        function executeTacticalSearch() {
            const query = document.getElementById('global-search').value.trim();
            if (!query) return;

            document.getElementById('status-display').innerText = `SCANNING: ${query.toUpperCase()}...`;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        const name = data[0].display_name;

                        document.getElementById('status-display').innerText = `TARGET LOCKED`;

                        // Smooth tactical zoom
                        map.flyTo([lat, lon], 13, { duration: 2.5 });

                        if (targetMarker) map.removeLayer(targetMarker);

                        // Tactical Marker
                        targetMarker = L.circleMarker([lat, lon], {
                            radius: 12,
                            color: '#4ade80',
                            fillColor: '#4ade80',
                            fillOpacity: 0.9
                        }).addTo(map).bindPopup(`<b style="color:#000;">${name}</b>`).openPopup();

                    } else {
                        alert('Target sector not found in database.');
                    }
                })
                .catch(err => console.error(err));
        }

        document.getElementById('exec-btn').addEventListener('click', executeTacticalSearch);
        document.getElementById('global-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeTacticalSearch();
        });

        // Live Real-Time GPS Velocity & Telemetry Tracking
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                document.getElementById('velocity-val').innerText = `${speed}.0 KM/H`;
            }, (err) => {}, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
