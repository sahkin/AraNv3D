<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AraNv3D - Autonomous 3D AR Engine</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: system-ui, -apple-system, sans-serif; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2; pointer-events: none; }

        .hud-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 16px; padding: 16px 20px; pointer-events: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8); color: white;
        }
        .hud-header { display: flex; justify-content: space-between; align-items: center; }
        .title-tag { color: #38bdf8; font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .metric-value { color: #f8fafc; font-size: 22px; font-weight: 900; font-family: monospace; }
        .status-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 10px #4ade80; }
        
        .hud-controls { display: flex; gap: 10px; margin: 0 auto; width: 100%; max-width: 400px; }
        .hud-btn {
            flex: 1; padding: 14px; border: none; border-radius: 12px; background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #38bdf8; font-weight: 800; font-size: 12px;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.3s;
        }
        .hud-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-color: #38bdf8; }
    </style>
</head>
<body>
    <div id="map"></div>
    <canvas id="ar-canvas"></canvas>

    <div class="hud-container">
        <div class="glass-panel hud-header">
            <div>
                <div class="title-tag"><span class="status-dot"></span>AI RADAR ENGINE</div>
                <div style="color: #cbd5e1; font-size: 11px; margin-top: 2px;">AUTO TRACKING LOCK</div>
            </div>
            <div style="text-align: right;">
                <div class="title-tag">VELOCITY</div>
                <div class="metric-value" id="speed-meter">0 KM/H</div>
            </div>
        </div>

        <div class="hud-controls">
            <button class="hud-btn active" id="btn-3d">3D SPATIAL</button>
            <button class="hud-btn" id="btn-ar">AR HUD</button>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiYTAwMDc4OSIsImEiOiJjbTdia2xvM20wM3lzMm5zOTF5d2Y5bWF0In0.demo_public_key';
        
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [73.0479, 33.6844],
            zoom: 18,
            pitch: 70,
            bearing: -17.6,
            antialias: true
        });

        map.on('style.load', () => {
            const layers = map.getStyle().layers;
            const labelLayerId = layers.find(l => l.type === 'symbol' && l.layout['text-field'])?.id;

            map.addLayer({
                'id': '3d-buildings',
                'source': 'composite',
                'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'],
                'type': 'fill-extrusion',
                'minzoom': 14,
                'paint': {
                    'fill-extrusion-color': '#0f172a',
                    'fill-extrusion-height': ['get', 'height'],
                    'fill-extrusion-base': ['get', 'min_height'],
                    'fill-extrusion-opacity': 0.85
                }
            }, labelLayerId);
        });

        // Auto Geolocation Engine
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((p) => {
                const lng = p.coords.longitude;
                const lat = p.coords.latitude;
                const speed = p.coords.speed ? Math.round(p.coords.speed * 3.6) : 0;
                
                document.getElementById('speed-meter').innerText = `${speed} KM/H`;

                map.flyTo({
                    center: [lng, lat],
                    zoom: 18,
                    pitch: 75,
                    bearing: p.coords.heading || -17.6,
                    essential: true,
                    duration: 1500
                });
            }, (err) => console.log(err), { enableHighAccuracy: true, maximumAge: 1000 });
        }

        // Three.js AR Overlay Engine
        const canvas = document.getElementById('ar-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ringGeo = new THREE.RingGeometry(1, 1.2, 32);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide });
        const ring = new THREE.Mesh(ringGeo, ringMat);
        ring.position.z = -5;
        ring.rotation.x = Math.PI / 3;
        scene.add(ring);

        function animate() {
            requestAnimationFrame(animate);
            ring.rotation.z += 0.02;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
