<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GeoViz Pro - Advanced Geospatial Intelligence Platform</title>
    
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000103; font-family: 'Courier New', Courier, monospace; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        .master-hud {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
        }
        
        .top-deck { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }

        .search-module {
            background: rgba(2, 6, 23, 0.96); backdrop-filter: blur(40px);
            border: 1px solid rgba(56, 189, 248, 0.8); border-radius: 12px; padding: 10px 14px;
            display: flex; gap: 10px; box-shadow: 0 30px 60px rgba(0,0,0,0.95);
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: #38bdf8; font-size: 13px; font-weight: 900; font-family: monospace;
        }
        .search-input::placeholder { color: #1e293b; }
        
        .exec-btn {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); border: none; border-radius: 8px;
            padding: 0 18px; color: white; font-weight: 900; font-size: 10px; letter-spacing: 2px; cursor: pointer;
            box-shadow: 0 0 25px rgba(2, 132, 199, 0.8); transition: all 0.3s ease;
        }
        .exec-btn:hover { transform: scale(1.05); box-shadow: 0 0 40px rgba(2, 132, 199, 1); }

        .telemetry-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }

        .tele-box {
            background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 10px; padding: 8px 12px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .tele-label { color: #38bdf8; font-size: 7px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
        .tele-val { color: #ffffff; font-size: 12px; font-weight: 900; font-family: monospace; margin-top: 2px; }
        .status-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 10px #22c55e; animation: blink 1s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }

        .radar-box {
            position: absolute; bottom: 85px; right: 14px; width: 110px; height: 110px;
            background: rgba(2, 6, 23, 0.9); border: 1px solid rgba(56, 189, 248, 0.7); border-radius: 50%;
            pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(2,132,199,0.5);
        }
        .radar-sweep {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0) 0deg, rgba(56, 189, 248, 0.8) 360deg);
            animation: spin 2s linear infinite;
        }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-center { width: 4px; height: 4px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; z-index: 2; }
        .radar-blip {
            position: absolute; width: 5px; height: 5px; background: #ef4444; border-radius: 50%;
            box-shadow: 0 0 8px #ef4444; top: 32px; left: 70px;
        }

        .terminal-box {
            position: absolute; bottom: 85px; left: 14px; width: calc(100% - 150px); max-width: 320px;
            background: rgba(2, 6, 23, 0.88); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 10px;
            padding: 8px 10px; pointer-events: none; z-index: 10; font-size: 8px; color: #38bdf8;
            height: 70px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
            backdrop-filter: blur(20px);
        }
        .term-line { opacity: 0.85; margin-top: 2px; }

        .bottom-deck { display: flex; gap: 6px; pointer-events: auto; width: 100%; max-width: 440px; margin: 0 auto; }
        .mode-btn {
            flex: 1; padding: 11px 4px; border: none; border-radius: 10px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: 900; font-size: 8px;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-align: center;
            transition: all 0.3s ease;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.8);
        }
        .mode-btn:hover { transform: scale(1.02); }

        .suggestions-box {
            position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
            background: rgba(2, 6, 23, 0.98); border: 1px solid rgba(56, 189, 248, 0.5);
            border-radius: 0 0 12px 12px; max-height: 200px; overflow-y: auto;
            display: none;
        }
        .suggestion-item {
            padding: 8px 14px; color: #38bdf8; cursor: pointer; font-size: 11px;
            border-bottom: 1px solid rgba(56, 189, 248, 0.1);
        }
        .suggestion-item:hover { background: rgba(56, 189, 248, 0.1); }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="radar-box">
        <div class="radar-sweep"></div>
        <div class="radar-blip"></div>
        <div class="radar-center"></div>
    </div>

    <div class="terminal-box" id="terminal-logs">
        <div class="term-line">> [INIT] GeoViz Pro v2.0 Loaded</div>
        <div class="term-line">> [SYSTEM] 3D Globe + Real-time Geocoding Active</div>
        <div class="term-line">> [READY] Enter location to visualize</div>
    </div>

    <div class="master-hud">
        <div class="top-deck">
            <div class="search-module" style="position: relative;">
                <input type="text" class="search-input" id="global-search" placeholder="Search any city, country, or landmark..." autocomplete="off">
                <button class="exec-btn" id="exec-btn">SEARCH</button>
                <div class="suggestions-box" id="suggestions"></div>
            </div>

            <div class="telemetry-row">
                <div class="tele-box">
                    <div class="tele-label"><span class="status-dot"></span>SYSTEM</div>
                    <div class="tele-val" id="status-display">ONLINE</div>
                </div>
                <div class="tele-box" style="text-align: right;">
                    <div class="tele-label">COORDINATES</div>
                    <div class="tele-val" id="coords-val">--, --</div>
                </div>
                <div class="tele-box" style="text-align: right;">
                    <div class="tele-label">ELEVATION</div>
                    <div class="tele-val" id="elevation-val">-- m</div>
                </div>
            </div>
        </div>

        <div class="bottom-deck">
            <button class="mode-btn active" id="btn-globe">GLOBE</button>
            <button class="mode-btn" id="btn-towers">TOWERS</button>
            <button class="mode-btn" id="btn-fencing">FENCE</button>
            <button class="mode-btn" id="btn-satellite">SATELLITE</button>
        </div>
    </div>

    <script>
        // Utility Functions
        function logTerm(msg) {
            const box = document.getElementById('terminal-logs');
            const line = document.createElement('div');
            line.className = 'term-line';
            line.innerText = `> ${msg}`;
            box.appendChild(line);
            if (box.childNodes.length > 6) box.removeChild(box.firstChild);
        }

        function getVector3FromLatLon(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(r * Math.sin(phi) * Math.cos(theta));
            const z = (r * Math.sin(phi) * Math.sin(theta));
            const y = (r * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // Three.js Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000103, 0.015);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.rotateSpeed = 0.6;
        controls.zoomSpeed = 1.0;
        controls.minDistance = 3;
        controls.maxDistance = 30;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404060, 1.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);
        sunLight.position.set(20, 20, 20);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const backLight = new THREE.DirectionalLight(0x4488ff, 0.5);
        backLight.position.set(-20, -10, -20);
        scene.add(backLight);

        // Star Field
        const starsGeometry = new THREE.BufferGeometry();
        const starsCount = 5000;
        const starPositions = new Float32Array(starsCount * 3);
        for (let i = 0; i < starsCount * 3; i += 3) {
            const radius = 100 + Math.random() * 50;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);
            starPositions[i] = radius * Math.sin(phi) * Math.cos(theta);
            starPositions[i+1] = radius * Math.sin(phi) * Math.sin(theta);
            starPositions[i+2] = radius * Math.cos(phi);
        }
        starsGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.1, transparent: true });
        const stars = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(stars);

        // Earth
        const radius = 5;
        const sphereGeo = new THREE.SphereGeometry(radius, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const sphereMat = new THREE.MeshPhongMaterial({ 
            map: earthTex, 
            shininess: 25,
            specular: new THREE.Color(0x333333)
        });
        const earthSphere = new THREE.Mesh(sphereGeo, sphereMat);
        earthSphere.castShadow = true;
        scene.add(earthSphere);

        // Atmosphere
        const glowGeo = new THREE.SphereGeometry(radius * 1.02, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ 
            color: 0x4488ff, 
            transparent: true, 
            opacity: 0.1, 
            side: THREE.BackSide 
        });
        const glowSphere = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glowSphere);

        // Target Marker
        const targetGroup = new THREE.Group();
        
        // Pin
        const pinGeo = new THREE.CylinderGeometry(0.02, 0.04, 0.5, 16);
        const pinMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
        const pin = new THREE.Mesh(pinGeo, pinMat);
        pin.position.y = 0.25;
        targetGroup.add(pin);

        // Ring
        const targetRingGeo = new THREE.RingGeometry(0.2, 0.25, 32);
        targetRingGeo.rotateX(Math.PI / 2);
        const targetRingMat = new THREE.MeshBasicMaterial({ 
            color: 0x22c55e, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.8 
        });
        const ring = new THREE.Mesh(targetRingGeo, targetRingMat);
        ring.position.y = 0.01;
        targetGroup.add(ring);

        // Pulse effect
        const pulseRingGeo = new THREE.RingGeometry(0.3, 0.32, 32);
        pulseRingGeo.rotateX(Math.PI / 2);
        const pulseRingMat = new THREE.MeshBasicMaterial({ 
            color: 0x22c55e, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.3 
        });
        const pulseRing = new THREE.Mesh(pulseRingGeo, pulseRingMat);
        pulseRing.position.y = 0.01;
        targetGroup.add(pulseRing);

        targetGroup.visible = false;
        scene.add(targetGroup);

        // Cell Towers
        const towersGroup = new THREE.Group();
        const towerGeo = new THREE.ConeGeometry(0.05, 0.3, 8);
        const towerMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
        
        const towerCoords = [
            {lat: 33.6844, lon: 73.0479, name: 'Islamabad'},
            {lat: 31.5497, lon: 74.3436, name: 'Lahore'},
            {lat: 24.8607, lon: 67.0011, name: 'Karachi'},
            {lat: 51.5074, lon: -0.1278, name: 'London'},
            {lat: 40.7128, lon: -74.0060, name: 'New York'},
            {lat: 48.8566, lon: 2.3522, name: 'Paris'},
            {lat: 35.6762, lon: 139.6503, name: 'Tokyo'},
            {lat: -33.8688, lon: 151.2093, name: 'Sydney'},
            {lat: 19.0760, lon: 72.8777, name: 'Mumbai'},
            {lat: 30.0444, lon: 31.2357, name: 'Cairo'},
            {lat: -23.5505, lon: -46.6333, name: 'São Paulo'},
            {lat: 55.7558, lon: 37.6173, name: 'Moscow'}
        ];

        const lineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.3 });

        towerCoords.forEach(c => {
            const pos = getVector3FromLatLon(c.lat, c.lon, radius);
            
            // Tower
            const tMesh = new THREE.Mesh(towerGeo, towerMat);
            tMesh.position.copy(pos);
            tMesh.lookAt(0, 0, 0);
            tMesh.rotateX(Math.PI / 2);
            towersGroup.add(tMesh);

            // Connection line to center
            const points = [new THREE.Vector3(0,0,0), pos];
            const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
            const line = new THREE.Line(lineGeo, lineMat);
            towersGroup.add(line);

            // Label (small dot)
            const dotGeo = new THREE.SphereGeometry(0.02, 8, 8);
            const dotMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
            const dot = new THREE.Mesh(dotGeo, dotMat);
            dot.position.copy(pos);
            towersGroup.add(dot);
        });
        towersGroup.visible = false;
        scene.add(towersGroup);

        // Geo-Fence
        const fenceGroup = new THREE.Group();
        const fenceGeo = new THREE.RingGeometry(0.6, 0.68, 64);
        fenceGeo.rotateX(Math.PI / 2);
        const fenceMat = new THREE.MeshBasicMaterial({ 
            color: 0xef4444, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.7 
        });
        const fenceRing = new THREE.Mesh(fenceGeo, fenceMat);
        fenceRing.position.y = 0.01;
        fenceGroup.add(fenceRing);

        // Inner ring
        const innerFenceGeo = new THREE.RingGeometry(0.65, 0.66, 64);
        innerFenceGeo.rotateX(Math.PI / 2);
        const innerFenceMat = new THREE.MeshBasicMaterial({ 
            color: 0xff6666, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.9 
        });
        const innerFence = new THREE.Mesh(innerFenceGeo, innerFenceMat);
        innerFence.position.y = 0.02;
        fenceGroup.add(innerFence);

        fenceGroup.visible = false;
        scene.add(fenceGroup);

        // Satellite mode - orbit rings
        const satelliteGroup = new THREE.Group();
        const orbitRingGeo = new THREE.RingGeometry(radius * 1.3, radius * 1.31, 64);
        orbitRingGeo.rotateX(Math.PI / 2.5);
        const orbitRingMat = new THREE.MeshBasicMaterial({ 
            color: 0x38bdf8, 
            side: THREE.DoubleSide, 
            transparent: true, 
            opacity: 0.15 
        });
        const orbitRing = new THREE.Mesh(orbitRingGeo, orbitRingMat);
        satelliteGroup.add(orbitRing);

        const orbitRing2 = orbitRing.clone();
        orbitRing2.rotation.x = Math.PI / 3;
        orbitRing2.material = orbitRingMat.clone();
        orbitRing2.material.opacity = 0.1;
        satelliteGroup.add(orbitRing2);

        const orbitLineMat = new THREE.LineBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.3 });
        const orbitPoints = [];
        for (let i = 0; i <= 64; i++) {
            const angle = (i / 64) * Math.PI * 2;
            orbitPoints.push(new THREE.Vector3(
                radius * 1.5 * Math.cos(angle),
                radius * 1.5 * Math.sin(angle) * 0.3,
                radius * 1.5 * Math.sin(angle) * 0.3
            ));
        }
        const orbitLineGeo = new THREE.BufferGeometry().setFromPoints(orbitPoints);
        const orbitLine = new THREE.Line(orbitLineGeo, orbitLineMat);
        satelliteGroup.add(orbitLine);

        satelliteGroup.visible = false;
        scene.add(satelliteGroup);

        // Initial camera position
        camera.position.set(0, 3, 12);
        controls.update();

        // Target Lock Function
        async function executeTargetLock() {
            const query = document.getElementById('global-search').value.trim();
            if (!query) return;

            document.getElementById('status-display').innerText = 'SEARCHING...';
            logTerm(`Searching for: "${query}"`);

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1&addressdetails=1`,
                    { headers: { 'User-Agent': 'GeoVizPro/1.0' } }
                );
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    const displayName = data[0].display_name.split(',')[0];
                    
                    // Get elevation (approximate - Nominatim doesn't provide it)
                    let elevation = 'N/A';
                    try {
                        const elevResponse = await fetch(
                            `https://api.opentopodata.org/v1/aster30m?locations=${lat},${lon}`
                        );
                        const elevData = await elevResponse.json();
                        if (elevData.results && elevData.results[0]) {
                            elevation = `${Math.round(elevData.results[0].elevation)}m`;
                        }
                    } catch (e) {
                        elevation = '-- m';
                    }

                    document.getElementById('status-display').innerText = `LOCKED: ${displayName}`;
                    document.getElementById('coords-val').innerText = `${lat.toFixed(4)}, ${lon.toFixed(4)}`;
                    document.getElementById('elevation-val').innerText = elevation;
                    
                    logTerm(`Target acquired at ${lat.toFixed(2)}, ${lon.toFixed(2)}`);
                    logTerm(`Elevation: ${elevation}`);

                    // Position target marker
                    const pos = getVector3FromLatLon(lat, lon, radius);
                    targetGroup.position.copy(pos);
                    targetGroup.lookAt(0, 0, 0);
                    targetGroup.rotateX(Math.PI / 2);
                    targetGroup.visible = true;

                    // Position fence
                    fenceGroup.position.copy(pos);
                    fenceGroup.lookAt(0, 0, 0);

                    // Disable auto-rotate
                    controls.autoRotate = false;

                    // Smooth zoom animation
                    const targetCamPos = getVector3FromLatLon(lat, lon, radius * 1.8);
                    const startPos = camera.position.clone();
                    let step = 0;
                    const maxSteps = 40;

                    function smoothZoom() {
                        if (step <= maxSteps) {
                            const t = step / maxSteps;
                            const ease = t * t * (3 - 2 * t); // Smoothstep
                            camera.position.lerpVectors(startPos, targetCamPos, ease);
                            controls.target.lerp(pos, ease * 0.5);
                            controls.update();
                            step++;
                            requestAnimationFrame(smoothZoom);
                        }
                    }
                    smoothZoom();

                } else {
                    document.getElementById('status-display').innerText = 'NOT FOUND';
                    logTerm(`Error: Location "${query}" not found`);
                }
            } catch (err) {
                console.error(err);
                document.getElementById('status-display').innerText = 'CONNECTION ERROR';
                logTerm(`Network error: ${err.message}`);
            }
        }

        // Debounced search suggestions
        let suggestionTimeout;
        document.getElementById('global-search').addEventListener('input', function() {
            clearTimeout(suggestionTimeout);
            const query = this.value.trim();
            const suggestionsBox = document.getElementById('suggestions');
            
            if (query.length < 3) {
                suggestionsBox.style.display = 'none';
                return;
            }

            suggestionTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(
                        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=5&addressdetails=1`,
                        { headers: { 'User-Agent': 'GeoVizPro/1.0' } }
                    );
                    const data = await response.json();
                    
                    suggestionsBox.innerHTML = '';
                    if (data.length > 0) {
                        data.forEach(item => {
                            const div = document.createElement('div');
                            div.className = 'suggestion-item';
                            div.textContent = item.display_name;
                            div.addEventListener('click', () => {
                                document.getElementById('global-search').value = item.display_name;
                                suggestionsBox.style.display = 'none';
                                executeTargetLock();
                            });
                            suggestionsBox.appendChild(div);
                        });
                        suggestionsBox.style.display = 'block';
                    } else {
                        suggestionsBox.style.display = 'none';
                    }
                } catch (e) {
                    suggestionsBox.style.display = 'none';
                }
            }, 300);
        });

        document.addEventListener('click', (e) => {
            if (!e.target.closest('.search-module')) {
                document.getElementById('suggestions').style.display = 'none';
            }
        });

        // Event Listeners
        document.getElementById('exec-btn').addEventListener('click', executeTargetLock);
        document.getElementById('global-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('suggestions').style.display = 'none';
                executeTargetLock();
            }
        });

        // Mode Switchers
        function setActiveMode(activeBtn) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
            
            towersGroup.visible = activeBtn.id === 'btn-towers';
            fenceGroup.visible = activeBtn.id === 'btn-fencing';
            satelliteGroup.visible = activeBtn.id === 'btn-satellite';
            glowSphere.visible = activeBtn.id !== 'btn-satellite';

            if (activeBtn.id === 'btn-globe') {
                document.getElementById('status-display').innerText = 'GLOBE MODE';
                logTerm('Switched to 3D Globe Mode');
            } else if (activeBtn.id === 'btn-towers') {
                document.getElementById('status-display').innerText = 'TOWERS MATRIX';
                logTerm('Switched to Cell Tower Visualization');
            } else if (activeBtn.id === 'btn-fencing') {
                document.getElementById('status-display').innerText = 'GEO-FENCE ACTIVE';
                logTerm('Switched to Geo-Fencing Mode');
            } else if (activeBtn.id === 'btn-satellite') {
                document.getElementById('status-display').innerText = 'SATELLITE OVERLAY';
                logTerm('Switched to Satellite Orbit View');
            }
        }

        document.getElementById('btn-globe').addEventListener('click', function() { setActiveMode(this); });
        document.getElementById('btn-towers').addEventListener('click', function() { setActiveMode(this); });
        document.getElementById('btn-fencing').addEventListener('click', function() { setActiveMode(this); });
        document.getElementById('btn-satellite').addEventListener('click', function() { setActiveMode(this); });

        // Animation Loop
        let pulseTime = 0;
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            
            // Pulse animation for target
            if (targetGroup.visible) {
                pulseTime += 0.05;
                const pulseScale = 1 + Math.sin(pulseTime) * 0.2;
                targetGroup.children[2].scale.set(pulseScale, pulseScale, pulseScale);
                targetGroup.children[2].material.opacity = 0.2 + Math.sin(pulseTime) * 0.1;
            }

            // Auto-rotate only when not zoomed in
            if (!targetGroup.visible) {
                earthSphere.rotation.y += 0.0005;
                glowSphere.rotation.y += 0.0006;
                towersGroup.rotation.y += 0.0005;
                satelliteGroup.rotation.y += 0.0003;
                stars.rotation.y -= 0.0001;
            }

            renderer.render(scene, camera);
        }
        animate();

        // Window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '1') setActiveMode(document.getElementById('btn-globe'));
            if (e.key === '2') setActiveMode(document.getElementById('btn-towers'));
            if (e.key === '3') setActiveMode(document.getElementById('btn-fencing'));
            if (e.key === '4') setActiveMode(document.getElementById('btn-satellite'));
            if (e.key === 'r' && !e.ctrlKey) {
                controls.autoRotate = !controls.autoRotate;
                logTerm(`Auto-rotate: ${controls.autoRotate ? 'ON' : 'OFF'}`);
            }
        });

        logTerm('System ready - type a location to begin');
    </script>
</body>
</html>
