<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXT-GEN 3D AR SPATIAL NAVIGATOR</title>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.js"></script>
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.1/mapbox-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
        .hud-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
        .hud-header { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 20px; padding: 16px; pointer-events: auto; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 20px 50px rgba(0,0,0,0.6); }
        .hud-title { color: #38bdf8; font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .hud-metrics { color: #f8fafc; font-size: 20px; font-weight: 900; font-family: monospace; }
        .ar-viewport { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; display: none; background: rgba(0,0,0,0.2); pointer-events: none; }
        .ar-pointer { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80px; height: 80px; border: 2px solid #38bdf8; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 30px #38bdf8; animation: scan 2s infinite ease-in-out; }
        @keyframes scan { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.3; } }
        .hud-controls { pointer-events: auto; display: flex; gap: 10px; width: 100%; max-width: 500px; margin: 0 auto; }
        .hud-btn { flex: 1; padding: 16px; border: none; border-radius: 16px; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); color: #fff; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .hud-btn-active { background: linear-gradient(135deg, #0284c7, #2563eb); border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.5); }
        .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 20px; background: rgba(34, 197, 94, 0.15); border: 1px solid rgba(34, 197, 94, 0.3); color: #4ade80; font-size: 10px; font-weight: 700; }
        .dot { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; }
    </style>
</head>
<body>
    <div id="map"></div>
    <div class="ar-viewport" id="arViewport">
        <div class="ar-pointer"><div style="width: 10px; height: 10px; background: #38bdf8; border-radius: 50%;"></div></div>
    </div>
    <div class="hud-overlay">
        <div class="hud-header">
            <div>
                <div class="hud-title">System Status</div>
                <div class="status-badge"><div class="dot"></div> SPATIAL 3D ACTIVE</div>
            </div>
            <div style="text-align: right;">
                <div class="hud-title">Speed / Heading</div>
                <div class="hud-metrics" id="speedMetric">0 KM/H</div>
            </div>
        </div>
        <div class="hud-controls">
            <button class="hud-btn hud-btn-active" id="btn3D" onclick="setMode('3d')">3D Map</button>
            <button class="hud-btn" id="btnAR" onclick="setMode('ar')">AR Mode</button>
            <button class="hud-btn" onclick="recenter()">Recenter</button>
        </div>
    </div>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiYTAwMDc4OSIsImEiOiJjbTdia2xvM20wM3lzMm5zOTF5d2Y5bWF0In0.demo_public_key';
        let currentMode = '3d';
        let userPos = [73.0479, 33.6844];
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: userPos,
            zoom: 17.5,
            pitch: 75,
            bearing: -20,
            antialias: true
        });
        map.on('style.load', () => {
            const layers = map.getStyle().layers;
            const labelLayerId = layers.find(layer => layer.type === 'symbol' && layer.layout['text-field']).id;
            map.addLayer({
                'id': 'realtime-3d-buildings',
                'source': 'composite',
                'source-layer': 'building',
                'filter': ['==', 'extrude', 'true'],
                'type': 'fill-extrusion',
                'minzoom': 14,
                'paint': {
                    'fill-extrusion-color': ['interpolate', ['linear'], ['get', 'height'], 0, '#0f172a', 50, '#1e293b', 100, '#0284c7'],
                    'fill-extrusion-height': ['get', 'height'],
                    'fill-extrusion-base': ['get', 'min_height'],
                    'fill-extrusion-opacity': 0.85
                }
            }, labelLayerId);
        });
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((position) => {
                userPos = [position.coords.longitude, position.coords.latitude];
                const speed = position.coords.speed ? Math.round(position.coords.speed * 3.6) : 0;
                document.getElementById('speedMetric').innerText = `${speed} KM/H`;
                if (currentMode === '3d') {
                    map.flyTo({ center: userPos, zoom: 18, pitch: 75, bearing: position.coords.heading || -20, essential: true, duration: 2000 });
                }
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }
        function setMode(mode) {
            currentMode = mode;
            document.getElementById('btn3D').classList.remove('hud-btn-active');
            document.getElementById('btnAR').classList.remove('hud-btn-active');
            if (mode === '3d') {
                document.getElementById('btn3D').classList.add('hud-btn-active');
                document.getElementById('arViewport').style.display = 'none';
                map.easeTo({ pitch: 75, zoom: 18, duration: 1000 });
            } else if (mode === 'ar') {
                document.getElementById('btnAR').classList.add('hud-btn-active');
                document.getElementById('arViewport').style.display = 'block';
                map.easeTo({ pitch: 85, zoom: 20, duration: 1000 });
            }
        }
        function recenter() { map.flyTo({ center: userPos, zoom: 18, pitch: 75, duration: 1000 }); }
    </script>
</body>
</html>
