<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionX // Live Satellite Neural Core</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Ultra-Futuristic Live HUD */
        .hud-panel {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 440px;
            background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 16px;
            padding: 14px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
        }

        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 6px;
            font-size: 10px; font-weight: bold; color: #38bdf8; letter-spacing: 2px;
        }

        .input-box {
            display: flex; align-items: center; gap: 10px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 12px;
        }
        .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }
        .input-box input::placeholder { color: #64748b; }

        /* Live Satellite Downlink Terminal */
        .satellite-terminal {
            background: rgba(2, 132, 199, 0.15); border: 1px solid #0284c7;
            border-radius: 8px; padding: 10px; font-size: 11px; color: #38bdf8;
            display: flex; gap: 8px; align-items: flex-start; line-height: 1.4;
        }

        .btn-live {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none;
            border-radius: 8px; padding: 11px; font-weight: bold; font-size: 11px;
            letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .btn-live:hover { opacity: 0.9; transform: translateY(-1px); }

        /* Side Controls */
        .side-menu {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }
        .icon-btn {
            width: 42px; height: 42px; background: rgba(3, 7, 18, 0.9);
            backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px; color: #38bdf8; display: flex; align-items: center;
            justify-content: center; font-size: 15px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        .icon-btn:active { background: #0284c7; color: #fff; }

        /* Bottom Live Telemetry */
        .telemetry-bar {
            position: absolute; bottom: 20px; left: 15px; z-index: 1000;
            background: rgba(3, 7, 18, 0.9); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 14px; border-radius: 10px; font-size: 10px; color: #38bdf8;
            backdrop-filter: blur(15px); display: flex; flex-direction: column; gap: 3px;
        }
        .live-pulse-row { display: flex; align-items: center; gap: 6px; font-weight: bold; color: #22c55e; }
        .dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.2; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Top Live Satellite Control Center -->
    <div class="hud-panel">
        <div class="hud-header">
            <span>VISIONX // LIVE SATELLITE DOWNLINK</span>
            <span style="color: #22c55e;" id="sat-status">● FEED LIVE</span>
        </div>
        
        <div class="input-box">
            <i class="fa-solid fa-satellite" style="color: #38bdf8; font-size: 12px;"></i>
            <input type="text" id="start-node" placeholder="Origin Node (e.g. Abbottabad)">
        </div>
        <div class="input-box">
            <i class="fa-solid fa-location-crosshairs" style="color: #ef4444; font-size: 12px;"></i>
            <input type="text" id="dest-node" placeholder="Target Destination (e.g. Balakot)">
        </div>

        <!-- Live Satellite AI Terminal -->
        <div class="satellite-terminal" id="sat-terminal">
            <i class="fa-solid fa-signal"></i>
            <span id="sat-msg">Live satellite connection established. Real-time optical feed active. Ready for quantum road routing.</span>
        </div>

        <button class="btn-live" id="engage-sat-btn">ENGAGE LIVE SATELLITE NAVIGATION</button>
    </div>

    <!-- Side Menu -->
    <div class="side-menu">
        <button class="icon-btn" id="refresh-sat-btn" title="Refresh Live Satellite Feed"><i class="fa-solid fa-rotate"></i></button>
        <button class="icon-btn" id="tilt-btn" title="Toggle 3D View"><i class="fa-solid fa-cube"></i></button>
        <button class="icon-btn" id="reset-btn" title="Recenter View"><i class="fa-solid fa-compass"></i></button>
    </div>

    <!-- Bottom Telemetry -->
    <div class="telemetry-bar">
        <div class="live-pulse-row"><div class="dot"></div> SATELLITE DOWNLINK: 60FPS SYNC</div>
        <span id="coord-hud" style="color: #94a3b8;">LAT: 34.2182 | LNG: 73.2399 | ZOOM: 13x</span>
    </div>

    <script>
        // 1. Initialize MapLibre with High-Performance Live Satellite Feed
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'live-satellite': {
                        type: 'raster',
                        tiles: [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256,
                        maxzoom: 20
                    }
                },
                layers: [{
                    id: 'live-satellite-layer',
                    type: 'raster',
                    source: 'live-satellite',
                    minzoom: 0,
                    maxzoom: 20
                }]
            },
            center: [73.2399, 34.2182],
            zoom: 13,
            pitch: 50,
            bearing: 0
        });

        let currentPitch = 50;

        async function fetchCoordinates(query) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if(data && data.length > 0) return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
            return null;
        }

        // 2. Live Satellite & True-Road Navigation Engine
        document.getElementById('engage-sat-btn').addEventListener('click', async () => {
            const startStr = document.getElementById('start-node').value.trim();
            const destStr = document.getElementById('dest-node').value.trim();
            const btn = document.getElementById('engage-sat-btn');
            const satMsg = document.getElementById('sat-msg');

            if(!startStr || !destStr) {
                alert("Please specify both origin and destination nodes.");
                return;
            }

            btn.innerText = "SYNCING LIVE SATELLITE...";
            satMsg.innerText = `Fetching live optical feeds and calculating optimal road vectors from ${startStr} to ${destStr}...`;

            const start = await fetchCoordinates(startStr);
            const dest = await fetchCoordinates(destStr);

            if(!start || !dest) {
                satMsg.innerText = "Error: Satellite downlink failed to resolve coordinates.";
                btn.innerText = "ENGAGE LIVE SATELLITE NAVIGATION";
                return;
            }

            // Real Road Network Query via OSRM
            const url = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if(!data.routes || data.routes.length === 0) {
                    satMsg.innerText = "No drivable road route found via satellite telemetry.";
                    btn.innerText = "ENGAGE LIVE SATELLITE NAVIGATION";
                    return;
                }

                const geometry = data.routes[0].geometry;
                const distanceKm = (data.routes[0].distance / 1000).toFixed(1);

                // Remove existing route if any
                if (map.getSource('live-route')) {
                    map.removeLayer('live-route-line');
                    map.removeSource('live-route');
                }

                // Add True-Road Polyline over Live Satellite
                map.addSource('live-route', {
                    type: 'geojson',
                    data: { type: 'Feature', geometry: geometry }
                });

                map.addLayer({
                    id: 'live-route-line',
                    type: 'line',
                    source: 'live-route',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#00f0ff', 'line-width': 6, 'line-opacity': 0.95 }
                });

                // Live Feedback Update
                satMsg.innerHTML = `<b style="color:#22c55e;">SATELLITE LOCK ACQUIRED (${distanceKm} KM):</b> Live optical telemetry synced. Optimal road trajectory highlighted.`;

                // Smooth Cinematic 3D Camera Fit
                const coords = geometry.coordinates;
                const bounds = coords.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
                map.fitBounds(bounds, { padding: 70, pitch: 55, duration: 3000 });

                btn.innerText = "SATELLITE LINK ACTIVE";
                setTimeout(() => { btn.innerText = "ENGAGE LIVE SATELLITE NAVIGATION"; }, 3500);

            } catch (err) {
                satMsg.innerText = "Critical telemetry breakdown during satellite sync.";
                btn.innerText = "ENGAGE LIVE SATELLITE NAVIGATION";
            }
        });

        // Refresh Live Satellite Feed Button
        document.getElementById('refresh-sat-btn').addEventListener('click', () => {
            const satStatus = document.getElementById('sat-status');
            satStatus.innerText = "● RE-SYNCING...";
            map.style.stylesheet.sources['live-satellite'].tiles = [
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?t=' + Date.now()
            ];
            map.setStyle(map.getStyle());
            setTimeout(() => { satStatus.innerText = "● FEED LIVE"; }, 1000);
        });

        // UI Controls
        document.getElementById('tilt-btn').addEventListener('click', () => {
            currentPitch = currentPitch === 0 ? 60 : 0;
            map.easeTo({ pitch: currentPitch, duration: 1000 });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            map.easeTo({ pitch: 50, bearing: 0, zoom: 13, duration: 1000 });
        });

        // Telemetry Update
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('coord-hud').innerText = `LAT: ${center.lat.toFixed(4)} | LNG: ${center.lng.toFixed(4)} | ZOOM: ${map.getZoom().toFixed(1) + 'x'}`;
        });
    </script>
</body>
</html>
