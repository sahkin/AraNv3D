<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionX // 3D Satellite Tactical Engine</title>
    
    <!-- MapLibre GL 3D Libraries -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #38bdf8; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD Controller */
        .hud-panel {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 420px;
            background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(16px);
            border: 1px solid #0284c7; border-radius: 10px; padding: 12px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            display: flex; flex-direction: column; gap: 8px;
        }

        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 6px;
        }
        .brand { font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; }
        .live-tag { font-size: 9px; color: #22c55e; font-weight: bold; }

        .inputs-group { display: flex; flex-direction: column; gap: 6px; }
        .hud-input {
            width: 100%; background: #0f172a; border: 1px solid #1e293b; border-radius: 4px;
            padding: 8px 10px; color: #fff; font-size: 12px; outline: none;
        }

        .hud-btn {
            background: #0284c7; color: white; border: none; border-radius: 4px;
            padding: 10px; font-weight: bold; font-size: 11px; cursor: pointer; letter-spacing: 1px;
        }

        .hud-status {
            display: flex; justify-content: space-between; font-size: 9px; color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 4px;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-panel">
        <div class="hud-header">
            <span class="brand">VISIONX // 3D_SATELLITE_CORE</span>
            <span class="live-tag">● VECTOR 3D ENGINE</span>
        </div>

        <div class="inputs-group">
            <input type="text" id="start-node" class="hud-input" placeholder="Start Point (e.g. Islamabad)">
            <input type="text" id="dest-node" class="hud-input" placeholder="Destination (e.g. Karachi)">
            <button class="hud-btn" id="nav-btn">CALCULATE REAL ROAD ROUTE</button>
        </div>

        <div class="hud-status">
            <span id="pitch-display">PITCH: 45° (3D)</span>
            <span id="zoom-display">ZOOM: 14x</span>
        </div>
    </div>

    <script>
        // 1. Initialize MapLibre 3D Satellite Map (With Tilt and Rotation)
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'satellite-tiles': {
                        type: 'raster',
                        tiles: [
                            'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
                        ],
                        tileSize: 256,
                        maxzoom: 19
                    }
                },
                layers: [
                    {
                        id: 'satellite-layer',
                        type: 'raster',
                        source: 'satellite-tiles',
                        minzoom: 0,
                        maxzoom: 19
                    }
                ]
            },
            center: [73.0479, 33.6844], // Islamabad [LNG, LAT]
            zoom: 13,
            pitch: 50, // 3D Perspective View
            bearing: -10, // Rotated Angle
            maxZoom: 18
        });

        // Add 3D Navigation Controls
        map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }));

        // 2. Geocoding Function (Location to Lat/Lng)
        async function getCoords(location) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}`);
            const data = await res.json();
            if (data && data.length > 0) {
                return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
            }
            return null;
        }

        // 3. Real Road Route Engine (OSRM Routing Service)
        document.getElementById('nav-btn').addEventListener('click', async () => {
            const startStr = document.getElementById('start-node').value.trim();
            const destStr = document.getElementById('dest-node').value.trim();
            const btn = document.getElementById('nav-btn');

            if(!startStr || !destStr) {
                alert("Please fill both location fields.");
                return;
            }

            btn.innerText = "FETCHING ROAD GEOMETRY...";

            const startCoords = await getCoords(startStr);
            const destCoords = await getCoords(destStr);

            if(!startCoords || !destCoords) {
                alert("Location not found.");
                btn.innerText = "CALCULATE REAL ROAD ROUTE";
                return;
            }

            // Fetch actual road geometry from OpenSource Routing Machine
            const routeUrl = `https://router.project-osrm.org/route/v1/driving/${startCoords[0]},${startCoords[1]};${destCoords[0]},${destCoords[1]}?overview=full&geometries=geojson`;

            try {
                const routeRes = await fetch(routeUrl);
                const routeData = await routeRes.json();

                if(!routeData.routes || routeData.routes.length === 0) {
                    alert("No driving route found between these points.");
                    return;
                }

                const geometry = routeData.routes[0].geometry;

                // Remove existing route if any
                if (map.getSource('route')) {
                    map.removeLayer('route-line');
                    map.removeSource('route');
                }

                // Add Real Road Geometry Polyline to Map
                map.addSource('route', {
                    'type': 'geojson',
                    'data': {
                        'type': 'Feature',
                        'properties': {},
                        'geometry': geometry
                    }
                });

                map.addLayer({
                    'id': 'route-line',
                    'type': 'line',
                    'source': 'route',
                    'layout': {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    'paint': {
                        'line-color': '#00f0ff',
                        'line-width': 6,
                        'line-opacity': 0.85
                    }
                });

                // Auto Fit Camera with Smooth 3D Transition
                const coordinates = geometry.coordinates;
                const bounds = coordinates.reduce((bounds, coord) => {
                    return bounds.extend(coord);
                }, new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));

                map.fitBounds(bounds, { padding: 80, pitch: 45, duration: 2500 });
                btn.innerText = "ROUTE LOCKED (ROAD PATTERN)";

            } catch (e) {
                alert("Error connecting to route server.");
            } finally {
                setTimeout(() => { btn.innerText = "CALCULATE REAL ROAD ROUTE"; }, 3000);
            }
        });

        // Camera Tracking Display
        map.on('move', () => {
            document.getElementById('zoom-display').innerText = `ZOOM: ${map.getZoom().toFixed(1)}x`;
            document.getElementById('pitch-display').innerText = `PITCH: ${map.getPitch().toFixed(0)}° (3D)`;
        });
    </script>
</body>
</html>
