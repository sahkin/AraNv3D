<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AraNv3D - Quantum Spatial Enterprise Matrix</title>
    
    <!-- Three.js & OrbitControls for Billion-Dollar Fluid Navigation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000208; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #quantum-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Elite Sci-Fi HUD Interface */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px;
        }
        
        .top-panel { display: flex; flex-direction: column; gap: 12px; pointer-events: auto; }

        .search-box-container {
            background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 18px; padding: 14px 18px;
            display: flex; gap: 12px; box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 15px rgba(56,189,248,0.15);
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 15px; font-weight: 700; letter-spacing: 0.5px;
        }
        .search-input::placeholder { color: #475569; }
        
        .search-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 12px;
            padding: 0 20px; color: white; font-weight: 900; font-size: 12px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 25px rgba(2, 132, 199, 0.7); transition: all 0.3s;
        }

        .telemetry-card {
            background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 18px; padding: 16px 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); color: #f8fafc; display: flex; justify-content: space-between; align-items: center;
        }
        
        .label-glow { color: #38bdf8; font-size: 10px; font-weight: 900; letter-spacing: 2.5px; text-transform: uppercase; text-shadow: 0 0 12px rgba(56,189,248,0.7); }
        .val-display { color: #ffffff; font-size: 22px; font-weight: 900; font-family: monospace; }
        .pulse-core { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 15px #4ade80; animation: pulse 1.5s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(1.3); } 100% { opacity: 1; transform: scale(1); } }

        .control-bar { display: flex; gap: 12px; pointer-events: auto; width: 100%; max-width: 450px; margin: 0 auto; }
        .quantum-btn {
            flex: 1; padding: 16px; border: none; border-radius: 16px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; font-weight: 900; font-size: 11px;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quantum-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.7);
        }
    </style>
</head>
<body>

    <div id="quantum-container"></div>

    <div class="hud-overlay">
        <div class="top-panel">
            <div class="search-box-container">
                <input type="text" class="search-input" id="global-search" placeholder="Enter coordinates, destination or galaxy node...">
                <button class="search-btn" id="exec-btn">SYNC</button>
            </div>

            <div class="telemetry-card">
                <div>
                    <div class="label-glow"><span class="pulse-core"></span>QUANTUM ORBIT MATRIX</div>
                    <div style="color: #94a3b8; font-size: 10px; font-weight: 700; margin-top: 3px;" id="status-display">SYSTEM ONLINE: READY</div>
                </div>
                <div style="text-align: right;">
                    <div class="label-glow">VELOCITY VECTOR</div>
                    <div class="val-display" id="velocity-val">0.0 KM/H</div>
                </div>
            </div>
        </div>

        <div class="control-bar">
            <button class="quantum-btn active" id="btn-globe">3D MATRIX</button>
            <button class="quantum-btn" id="btn-holo">HOLO AR</button>
        </div>
    </div>

    <script>
        // Billion-Dollar Enterprise Quantum 3D Spatial Core
        const container = document.getElementById('quantum-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000208, 0.04);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Fluid Orbit Controls for Smooth Professional Dragging & Zooming
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.2;
        controls.minDistance = 6;
        controls.maxDistance = 25;

        // Lighting System
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0x38bdf8, 2);
        sunLight.position.set(20, 20, 20);
        scene.add(sunLight);

        // High-Tech Sci-Fi Earth Globe Sphere with Multiplex Matrix Core
        const radius = 5;
        const sphereGeo = new THREE.SphereGeometry(radius, 64, 64);
        
        // Custom Shader Material Look for Elite Visuals
        const sphereMat = new THREE.MeshPhongMaterial({
            color: 0x020617,
            emissive: 0x0284c7,
            emissiveIntensity: 0.25,
            wireframe: false,
            shininess: 90
        });
        const earthSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(earthSphere);

        // Holographic Outer Grid Wireframe Overlay
        const wireGeo = new THREE.SphereGeometry(radius * 1.01, 32, 32);
        const wireMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const wireOverlay = new THREE.Mesh(wireGeo, wireMat);
        scene.add(wireOverlay);

        // Sci-Fi Atmosphere Glow
        const glowGeo = new THREE.SphereGeometry(radius * 1.12, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x0284c7,
            transparent: true,
            opacity: 0.15,
            side: THREE.BackSide
        });
        const glowSphere = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glowSphere);

        // Target Quantum Marker Pin
        const pinGeo = new THREE.ConeGeometry(0.2, 0.6, 16);
        const pinMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 });
        const targetMarker = new THREE.Mesh(pinGeo, pinMat);
        targetMarker.visible = false;
        scene.add(targetMarker);

        camera.position.set(0, 4, 14);
        controls.update();

        // Convert Lat/Lng to 3D Coordinates
        function getVector3FromLatLon(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(r * Math.sin(phi) * Math.cos(theta));
            const z = (r * Math.sin(phi) * Math.sin(theta));
            const y = (r * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // Real-Time Global Geocoding System
        function executeQuantumSearch() {
            const query = document.getElementById('global-search').value.trim();
            if (!query) return;

            document.getElementById('status-display').innerText = `SEARCHING MATRIX: ${query.toUpperCase()}...`;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        document.getElementById('status-display').innerText = `TARGET LOCKED: ${data[0].display_name.substring(0, 30)}...`;

                        const pos = getVector3FromLatLon(lat, lon, radius);
                        targetMarker.position.copy(pos);
                        targetMarker.lookAt(0, 0, 0);
                        targetMarker.visible = true;

                        // Smooth transition to target
                        controls.target.set(0, 0, 0);
                        camera.position.set(pos.x * 2.2, pos.y * 2.2, pos.z * 2.2);
                        controls.update();
                    } else {
                        alert('Spatial node not found in index.');
                    }
                })
                .catch(err => console.error(err));
        }

        document.getElementById('exec-btn').addEventListener('click', executeQuantumSearch);
        document.getElementById('global-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeQuantumSearch();
        });

        // Live GPS Connection
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                document.getElementById('velocity-val').innerText = `${speed}.0 KM/H`;
            }, (err) => {}, { enableHighAccuracy: true });
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            wireOverlay.rotation.y += 0.001;
            renderer.render(scene, camera);
        }
        animate();

        // Window Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Toggles
        const btnGlobe = document.getElementById('btn-globe');
        const btnHolo = document.getElementById('btn-holo');

        btnGlobe.addEventListener('click', () => {
            btnGlobe.classList.add('active');
            btnHolo.classList.remove('active');
            sphereMat.wireframe = false;
        });

        btnHolo.addEventListener('click', () => {
            btnHolo.classList.add('active');
            btnGlobe.classList.remove('active');
            sphereMat.wireframe = true;
        });
    </script>
</body>
</html>
