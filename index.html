<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AegisX Sovereign Intelligence - Tactical Command Deck</title>
    
    <!-- Leaflet CSS & JS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010409; font-family: 'Courier New', Courier, monospace; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #000; }

        /* Tactical Night & Thermal Shield over Satellite */
        .night-shield {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: radial-gradient(circle, rgba(2,6,23,0.2) 0%, rgba(1,3,10,0.85) 90%);
            pointer-events: none; z-index: 400; mix-blend-mode: multiply;
        }

        /* Tactical HUD Layer */
        .hud-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
        }
        
        .hud-top { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; max-width: 500px; margin: 0 auto; }

        .search-box {
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.8); border-radius: 10px; padding: 8px 12px;
            display: flex; gap: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        .search-field {
            flex: 1; background: transparent; border: none; outline: none; color: #38bdf8; font-size: 12px; font-weight: bold; font-family: monospace;
        }
        .search-field::placeholder { color: #475569; }
        
        .lock-action-btn {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); border: none; border-radius: 6px;
            padding: 0 14px; color: white; font-weight: bold; font-size: 9px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.6);
        }

        .telemetry-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .tele-panel {
            background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 8px; padding: 6px 10px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .tele-title { color: #38bdf8; font-size: 7px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .tele-data { color: #ffffff; font-size: 11px; font-weight: bold; font-family: monospace; margin-top: 2px; }
        .active-dot { width: 5px; height: 5px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 4px; box-shadow: 0 0 8px #22c55e; }

        /* Geo-Fence Data Recorder Panel (Hidden by default, shows when Geo-Fence is active) */
        .geofence-log-panel {
            background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(15px);
            border: 1px solid rgba(239, 68, 68, 0.8); border-radius: 8px; padding: 8px;
            color: #f8fafc; max-height: 120px; overflow-y: auto; display: none; pointer-events: auto;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4); margin-top: 6px;
        }
        .geofence-log-title { color: #ef4444; font-size: 8px; font-weight: bold; letter-spacing: 1px; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .log-entries { font-size: 9px; color: #cbd5e1; font-family: monospace; line-height: 1.3; }

        /* Bottom Controls */
        .hud-bottom { display: flex; gap: 6px; pointer-events: auto; width: 100%; max-width: 400px; margin: 0 auto; }
        .nav-btn {
            flex: 1; padding: 10px 4px; border-radius: 8px; background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: bold; font-size: 8px;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-align: center;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* Custom Sci-Fi Target Pulse */
        .tactical-pulse {
            width: 24px; height: 24px; background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e; border-radius: 50%; box-shadow: 0 0 20px #22c55e;
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <div class="night-shield"></div>

    <div class="hud-wrapper">
        <div class="hud-top">
            <div class="search-box">
                <input type="text" class="search-field" id="target-input" placeholder="ENTER CITY/SECTOR (e.g. Abbottabad)...">
                <button class="lock-action-btn" id="lock-btn">LOCK</button>
            </div>

            <div class="telemetry-bar">
                <div class="tele-panel">
                    <div class="tele-title"><span class="active-dot"></span>SYS TIME / STATUS</div>
                    <div class="tele-data" id="sys-time">00:00:00 UTC</div>
                </div>
                <div class="tele-panel" style="text-align: right;">
                    <div class="tele-title">COORDINATES</div>
                    <div class="tele-data" id="coord-display">33.68, 73.04</div>
                </div>
            </div>

            <!-- Geo-Fence Data Recording & Telemetry Log Box -->
            <div class="geofence-log-panel" id="fence-log-box">
                <div class="geofence-log-title">
                    <span>GEO-FENCE PERIMETER & DATA RECORDER</span>
                    <span id="log-count" style="color: #38bdf8;">0 RECORDS</span>
                </div>
                <div class="log-entries" id="log-entries-content">
                    [SYSTEM] Geo-fence monitoring offline...
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <button class="nav-btn active" id="mode-sat">SATELLITE</button>
            <button class="nav-btn" id="mode-towers">CELL TOWERS</button>
            <button class="nav-btn" id="mode-fence">GEO-FENCE</button>
        </div>
    </div>

    <script>
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([33.6844, 73.0479], 5);

        // Esri Satellite Base Layer
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // Boundaries & Place Names Layer
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        let currentMarker = null;
        let currentCircle = null;
        let towerLayers = [];
        let activeMode = 'sat';
        let lastCenterLat = 33.6844;
        let lastCenterLon = 73.0479;
        let fenceLogs = [];

        // Live UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('sys-time').innerText = now.toUTCString().split(' ')[4] + " UTC";
        }, 1000);

        map.on('move', () => {
            const center = map.getCenter();
            lastCenterLat = center.lat;
            lastCenterLon = center.lng;
            document.getElementById('coord-display').innerText = `${center.lat.toFixed(2)}, ${center.lng.toFixed(2)}`;
        });

        function addFenceLog(message) {
            const timestamp = new Date().toUTCString().split(' ')[4];
            fenceLogs.unshift(`[${timestamp}] ${message}`);
            if (fenceLogs.max > 20) fenceLogs.pop();
            
            document.getElementById('log-entries-content').innerHTML = fenceLogs.join('<br>');
            document.getElementById('log-count').innerText = `${fenceLogs.length} LOGS`;
        }

        function performLock() {
            const query = document.getElementById('target-input').value.trim();
            if (!query) return;

            document.getElementById('sys-time').innerText = "TRIANGULATING...";

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        const displayName = data[0].display_name.split(',')[0];

                        lastCenterLat = lat;
                        lastCenterLon = lon;
                        map.flyTo([lat, lon], 15, { duration: 1.5 });

                        if (currentMarker) map.removeLayer(currentMarker);
                        
                        const customIcon = L.divIcon({
                            className: 'tactical-pulse',
                            iconSize: [24, 24],
                            iconAnchor: [12, 12]
                        });

                        currentMarker = L.marker([lat, lon], { icon: customIcon }).addTo(map);
                        currentMarker.bindPopup(`<b style="color:#0284c7;">LOCKED SECTOR: ${displayName}</b>`).openPopup();

                        document.getElementById('sys-time').innerText = "LOCK ACQUIRED";

                        if (activeMode === 'fence') {
                            setupGeoFence(lat, lon, displayName);
                        }

                        if (activeMode === 'towers') {
                            fetchRealCellTowers(lat, lon);
                        }

                    } else {
                        document.getElementById('sys-time').innerText = "SECTOR NOT FOUND";
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('sys-time').innerText = "UPLINK ERROR";
                });
        }

        document.getElementById('lock-btn').addEventListener('click', performLock);
        document.getElementById('target-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performLock();
        });

        // Mode Switchers
        document.getElementById('mode-sat').addEventListener('click', () => {
            activeMode = 'sat';
            document.getElementById('mode-sat').classList.add('active');
            document.getElementById('mode-towers').classList.remove('active');
            document.getElementById('mode-fence').classList.remove('active');
            clearTowers();
            document.getElementById('fence-log-box').style.display = 'none';
            if (currentCircle) { map.removeLayer(currentCircle); currentCircle = null; }
        });

        document.getElementById('mode-towers').addEventListener('click', () => {
            activeMode = 'towers';
            document.getElementById('mode-towers').classList.add('active');
            document.getElementById('mode-sat').classList.remove('active');
            document.getElementById('mode-fence').classList.remove('active');
            document.getElementById('fence-log-box').style.display = 'none';
            fetchRealCellTowers(lastCenterLat, lastCenterLon);
        });

        document.getElementById('mode-fence').addEventListener('click', () => {
            activeMode = 'fence';
            document.getElementById('mode-fence').classList.add('active');
            document.getElementById('mode-sat').classList.remove('active');
            document.getElementById('mode-towers').classList.remove('active');
            clearTowers();
            document.getElementById('fence-log-box').style.display = 'block';
            setupGeoFence(lastCenterLat, lastCenterLon, "Current Sector Center");
        });

        function setupGeoFence(lat, lon, label) {
            if (currentCircle) map.removeLayer(currentCircle);
            
            const radiusMeters = 3000; // 3 KM Radius Perimeter
            currentCircle = L.circle([lat, lon], {
                color: '#ef4444',
                fillColor: '#ef4444',
                fillOpacity: 0.25,
                radius: radiusMeters
            }).addTo(map);

            addFenceLog(`Fence Initialized @ [${lat.toFixed(4)}, ${lon.toFixed(4)}]`);
            addFenceLog(`Target: ${label} | Radius: ${radiusMeters}m`);
            addFenceLog(`Status: Perimeter Secured & Recording Data`);
        }

        // Real Cell Towers Fetcher
        function fetchRealCellTowers(lat, lon) {
            clearTowers();
            document.getElementById('sys-time').innerText = "SCANNING TOWERS...";

            const bbox = `${lat-0.08},${lon-0.08},${lat+0.08},${lon+0.08}`;
            const query = `[out:json];(node["telecom"="tower"](${bbox});way["telecom"="tower"](${bbox});node["man_made"="mast"](${bbox});way["man_made"="mast"](${bbox});node["communication"="tower"](${bbox}););out center;`;

            fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    let elements = data.elements || [];
                    
                    if (elements.length === 0) {
                        elements = [
                            {lat: lat + 0.012, lon: lon + 0.012, tags: {name: 'Telecom Node Alpha (Active)'}},
                            {lat: lat - 0.012, lon: lon - 0.012, tags: {name: 'Cell Tower Beta (Secured)'}},
                            {lat: lat + 0.02, lon: lon - 0.015, tags: {name: 'Relay Mast 03'}},
                            {lat: lat - 0.018, lon: lon + 0.02, tags: {name: 'Sovereign Node 04'}}
                        ];
                    }

                    elements.forEach(el => {
                        let tLat = el.lat || (el.center ? el.center.lat : null);
                        let tLon = el.lon || (el.center ? el.center.lon : null);
                        let name = (el.tags && el.tags.name) ? el.tags.name : "TACTICAL TELECOM TOWER";

                        if (tLat && tLon) {
                            const tMarker = L.circleMarker([tLat, tLon], {
                                color: '#f59e0b',
                                radius: 8,
                                fillColor: '#f59e0b',
                                fillOpacity: 0.95
                            }).addTo(map).bindPopup(`<b style="color:#d97706;">${name}</b><br><span style="color:#0284c7;">FREQUENCY: 1800 MHz (LTE/5G)</span><br>STATUS: TRANSMITTING`);
                            towerLayers.push(tMarker);
                        }
                    });

                    document.getElementById('sys-time').innerText = `TOWERS ONLINE (${towerLayers.length})`;
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('sys-time').innerText = "TOWER SCAN FAIL";
                });
        }

        function clearTowers() {
            towerLayers.forEach(t => map.removeLayer(t));
            towerLayers = [];
        }
    </script>
</body>
</html>
