<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AEGIS-X SOVEREIGN INTELLIGENCE - PLANETARY COMMAND</title>
    
    <!-- Leaflet Engine & Canvas Extensions -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-base: #010409;
            --hud-border: #38bdf8;
            --hud-bg: rgba(2, 6, 23, 0.92);
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-base); font-family: var(--font-mono); }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #000; }

        /* 3D Globe Visual Mode Container */
        .globe-wrapper {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 2;
            background: #000; display: none; align-items: center; justify-content: center;
        }
        
        .planetary-sphere {
            width: 320px; height: 320px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #38bdf8 0%, #1e40af 40%, #020617 90%);
            box-shadow: 0 0 60px rgba(56, 189, 248, 0.4), inset -20px -20px 50px rgba(0,0,0,0.9);
            position: relative; animation: sphere-rotate 25s infinite linear;
        }

        @keyframes sphere-rotate { 0% { background-position: 0 0; } 100% { background-position: 400px 0; } }

        /* Tactical HUD Layer */
        .hud-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
        }
        
        .hud-top { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; max-width: 520px; margin: 0 auto; }

        .search-box {
            background: var(--hud-bg); backdrop-filter: blur(25px);
            border: 1px solid var(--hud-border); border-radius: 8px; padding: 8px 12px;
            display: flex; gap: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.9);
        }
        .search-field {
            flex: 1; background: transparent; border: none; outline: none; color: #38bdf8; font-size: 12px; font-weight: bold; font-family: var(--font-mono);
        }
        .search-field::placeholder { color: #475569; }
        
        .action-btn {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); border: none; border-radius: 6px;
            padding: 0 16px; color: white; font-weight: bold; font-size: 10px; letter-spacing: 1px; cursor: pointer;
        }

        .telemetry-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

        .tele-panel {
            background: var(--hud-bg); backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 6px; padding: 6px 10px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .tele-title { color: #38bdf8; font-size: 7px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .tele-data { color: #ffffff; font-size: 11px; font-weight: bold; font-family: var(--font-mono); margin-top: 2px; }

        /* Bottom Controls (Image 2 & 3 Style) */
        .hud-bottom { display: flex; gap: 6px; pointer-events: auto; width: 100%; max-width: 520px; margin: 0 auto; }
        .nav-btn {
            flex: 1; padding: 12px 2px; border-radius: 6px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: bold; font-size: 8.5px;
            letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; text-align: center;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.6);
        }

        /* Marker CSS Animation */
        .pulse-marker {
            width: 20px; height: 20px; background: rgba(56, 189, 248, 0.4);
            border: 2px solid #38bdf8; border-radius: 50%; box-shadow: 0 0 15px #38bdf8;
            animation: pulse-ring 1.2s infinite ease-in-out;
        }
        @keyframes pulse-ring { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
    </style>
</head>
<body>

    <!-- 2D High Precision Map Layer -->
    <div id="map"></div>

    <!-- 3D Global Earth Mode Screen (Screenshot 3 Replication) -->
    <div class="globe-wrapper" id="globe-view">
        <div class="planetary-sphere"></div>
    </div>

    <!-- Interface HUD Canvas -->
    <div class="hud-wrapper">
        <div class="hud-top">
            <div class="search-box">
                <input type="text" class="search-field" id="target-input" placeholder="ENTER LOCATION (e.g. Abbottabad, Vancouver)...">
                <button class="action-btn" id="lock-btn">LOCK</button>
            </div>

            <div class="telemetry-bar">
                <div class="tele-panel">
                    <div class="tele-title">SYS TIME / STATUS</div>
                    <div class="tele-data" id="sys-time">00:00:00 UTC</div>
                </div>
                <div class="tele-panel" style="text-align: right;">
                    <div class="tele-title">COORDINATES</div>
                    <div class="tele-data" id="coord-display">34.14, 73.21</div>
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <button class="nav-btn active" id="mode-sat">SATELLITE</button>
            <button class="nav-btn" id="mode-globe">3D PLANETARY GLOBE</button>
            <button class="nav-btn" id="mode-fence">GEO-FENCE</button>
        </div>
    </div>

    <script>
        // High-Precision Hybrid Engine Initialization (Screenshot 1 & 2 HD Mapping)
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false,
            maxZoom: 20
        }).setView([34.1441, 73.2103], 15);

        // Google Ultra HD Hybrid Tiles (Includes Satellite Imagery + Places, Roads & Restaurants)
        const googleHybrid = L.tileLayer('https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }).addTo(map);

        let currentMarker = null;

        // System Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('sys-time').innerText = now.toUTCString().split(' ')[4] + ' UTC';
        }, 1000);

        // Dynamic Coordinates Display
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('coord-display').innerText = `${center.lat.toFixed(2)}, ${center.lng.toFixed(2)}`;
        });

        // Search & Location Lock
        function performLock() {
            const query = document.getElementById('target-input').value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        map.flyTo([lat, lon], 17);

                        if (currentMarker) map.removeLayer(currentMarker);

                        const customIcon = L.divIcon({
                            className: 'pulse-marker',
                            iconSize: [20, 20],
                            iconAnchor: [10, 10]
                        });

                        currentMarker = L.marker([lat, lon], { icon: customIcon }).addTo(map);
                        currentMarker.bindPopup(`<b>SECTOR LOCKED: ${query.toUpperCase()}</b>`).openPopup();
                    }
                });
        }

        document.getElementById('lock-btn').addEventListener('click', performLock);
        document.getElementById('target-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') performLock(); });

        // Mode Navigation Switches
        document.getElementById('mode-sat').addEventListener('click', () => {
            document.getElementById('globe-view').style.display = 'none';
            document.getElementById('mode-sat').classList.add('active');
            document.getElementById('mode-globe').classList.remove('active');
        });

        document.getElementById('mode-globe').addEventListener('click', () => {
            document.getElementById('globe-view').style.display = 'flex';
            document.getElementById('mode-globe').classList.add('active');
            document.getElementById('mode-sat').classList.remove('active');
        });

        // Invisible Background Telemetry Processors (Weather, Traffic & Earthquakes)
        function runBackgroundSensors() {
            // Background Live Earthquake Monitoring
            fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson')
                .then(r => r.json())
                .then(data => {
                    console.log("Background Seismic Scan Active. Events:", data.features.length);
                }).catch(() => {});
        }
        setInterval(runBackgroundSensors, 30000);
        runBackgroundSensors();
    </script>
</body>
</html>
