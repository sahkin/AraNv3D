<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AegisX Command Deck - Satellites & Cams</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #010409; font-family: monospace; color: #38bdf8; }
        #globe-container { width: 100vw; height: 100vh; position: absolute; z-index: 1; }
        .hud { position: absolute; z-index: 10; padding: 15px; pointer-events: none; width: 100%; box-sizing: border-box; }
        .panel { background: rgba(2,6,23,0.85); border: 1px solid #38bdf8; padding: 10px; border-radius: 8px; margin-bottom: 10px; pointer-events: auto; }
        button { background: #0284c7; color: white; border: none; padding: 5px 10px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        #camera-feed { display: none; width: 250px; height: 150px; background: #000; border: 2px solid #ef4444; margin-top: 10px; position: relative; }
        .cam-text { position: absolute; top: 5px; left: 5px; color: #ef4444; font-size: 10px; font-weight: bold; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div id="globe-container"></div>
    
    <div class="hud">
        <div class="panel" style="max-width: 300px;">
            <h3>AEGIS-X SATELLITE & CAMERA UPLINK</h3>
            <button id="sat-btn">TRACK SATELLITES</button>
            <button id="cam-btn">LIVE CAMERA FEED</button>
            
            <div id="camera-feed">
                <div class="cam-text">🔴 REC - SECTOR 7 LINK</div>
                <!-- You can put a real live YouTube or IP cam iframe here later -->
                <div style="color: #475569; text-align: center; margin-top: 50px; font-size: 12px;">WAITING FOR API FEED...</div>
            </div>
            
            <div id="log" style="margin-top:10px; font-size: 10px; color: #22c55e;">[SYSTEM] Ready...</div>
        </div>
    </div>

    <script>
        // Basic 3D Globe Setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('globe-container').appendChild(renderer.domElement);

        const light = new THREE.PointLight(0x38bdf8, 2, 50);
        light.position.set(10, 10, 10);
        scene.add(light);
        scene.add(new THREE.AmbientLight(0xffffff, 0.5));

        const earth = new THREE.Mesh(
            new THREE.SphereGeometry(3, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0x0a192f, wireframe: true })
        );
        scene.add(earth);

        // Add 3 Satellites orbiting
        const satGroup = new THREE.Group();
        const satColors = [0xef4444, 0x22c55e, 0xf59e0b];
        for(let i=0; i<3; i++) {
            const sat = new THREE.Mesh(
                new THREE.BoxGeometry(0.2, 0.2, 0.2),
                new THREE.MeshBasicMaterial({ color: satColors[i] })
            );
            // Position them at different distances
            sat.position.set(Math.cos(i*2) * 4, Math.sin(i*2) * 3, Math.sin(i*3) * 4);
            satGroup.add(sat);
        }
        scene.add(satGroup);
        camera.position.z = 10;

        function animate() {
            requestAnimationFrame(animate);
            earth.rotation.y += 0.002;
            satGroup.rotation.y += 0.01; // Satellites orbit faster
            satGroup.rotation.x += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // UI Controls
        document.getElementById('sat-btn').addEventListener('click', () => {
            document.getElementById('log').innerHTML = "TRACKING: GPS-IIR, GLONASS, STARLINK-9X...<br>Status: IN ORBIT";
        });

        document.getElementById('cam-btn').addEventListener('click', () => {
            const camBox = document.getElementById('camera-feed');
            camBox.style.display = camBox.style.display === 'block' ? 'none' : 'block';
            document.getElementById('log').innerHTML = "ATTEMPTING CAMERA UPLINK...";
        });
    </script>
</body>
</html>
