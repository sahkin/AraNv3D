<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AegisX Sovereign Intelligence - Ultimate Tactical Command Deck</title>
    
    <!-- Leaflet CSS & JS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000205; font-family: 'Courier New', Courier, monospace; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #000; }

        /* Tactical Sci-Fi HUD Layer */
        .hud-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1000;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
        }
        
        .hud-top { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; max-width: 500px; margin: 0 auto; }

        .search-box {
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.7); border-radius: 10px; padding: 8px 12px;
            display: flex; gap: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        .search-field {
            flex: 1; background: transparent; border: none; outline: none; color: #38bdf8; font-size: 12px; font-weight: bold; font-family: monospace;
        }
        .search-field::placeholder { color: #475569; }
        
        .lock-action-btn {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); border: none; border-radius: 6px;
            padding: 0 14px; color: white; font-weight: bold; font-size: 9px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
        }

        .telemetry-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .tele-panel {
            background: rgba(2, 6, 23, 0.92); backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 8px; padding: 6px 10px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .tele-title { color: #38bdf8; font-size: 7px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .tele-data { color: #ffffff; font-size: 11px; font-weight: bold; font-family: monospace; margin-top: 2px; }
        .active-dot { width: 5px; height: 5px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 4px; box-shadow: 0 0 8px #22c55e; }

        /* Bottom Controls */
        .hud-bottom { display: flex; gap: 6px; pointer-events: auto; width: 100%; max-width: 400px; margin: 0 auto; }
        .nav-btn {
            flex: 1; padding: 10px 4px; border-radius: 8px; background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: bold; font-size: 8px;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-align: center;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.6);
        }

        /* Custom Sci-Fi Target Pulse */
        .tactical-pulse {
            width: 24px; height: 24px; background: rgba(34, 197, 94, 0.3);
            border: 2px solid #22c55e; border-radius: 50%; box-shadow: 0 0 20px #22c55e;
            animation: pulse-ring 1.5s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-wrapper">
        <div class="hud-top">
            <div class="search-box">
                <input type="text" class="search-field" id="target-input" placeholder="ENTER CITY/SECTOR (e.g. Islamabad, Tokyo)...">
                <button class="lock-action-btn" id="lock-btn">LOCK</button>
            </div>

            <div class="telemetry-bar">
                <div class="tele-panel">
                    <div class="tele-title"><span class="active-dot"></span>SYS TIME / STATUS</div>
                    <div class="tele-data" id="sys-time">00:00:00 UTC</div>
                </div>
                <div class="tele-panel" style="text-align: right;">
                    <div class="tele-title">COORDINATES</div>
                    <div class="tele-data" id="coord-display">33.68, 73.04</div>
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <button class="nav-btn active" id="mode-sat">SATELLITE</button>
            <button class="nav-btn" id="mode-towers">CELL TOWERS</button>
            <button class="nav-btn" id="mode-fence">GEO-FENCE</button>
        </div>
    </div>

    <script>
        // Initialize Leaflet Map
        const map = L.map('map', {
            zoomControl: false,
            attributionControl: false
        }).setView([33.6844, 73.0479], 5);

        // Esri Live Satellite Base Layer
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        // Esri World Boundaries and Place Names Layer (Shows cities and countries)
        L.tileLayer('https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(map);

        let currentMarker = null;
        let currentCircle = null;
        let towerLayers = [];
        let activeMode = 'sat';

        // Live UTC Clock
        setInterval(() => {
            const now = new Date();
            document.getElementById('sys-time').innerText = now.toUTCString().split(' ')[4] + " UTC";
        }, 1000);

        // Live Coordinate Tracker on Map Move
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('coord-display').innerText = `${center.lat.toFixed(2)}, ${center.lng.toFixed(2)}`;
        });

        // Search and Target Lock Function
        function performLock() {
            const query = document.getElementById('target-input').value.trim();
            if (!query) return;

            document.getElementById('sys-time').innerText = "TRIANGULATING...";

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        const displayName = data[0].display_name.split(',')[0];

                        map.flyTo([lat, lon], 13, { duration: 1.5 });

                        if (currentMarker) map.removeLayer(currentMarker);
                        
                        const customIcon = L.divIcon({
                            className: 'tactical-pulse',
                            iconSize: [24, 24],
                            iconAnchor: [12, 12]
                        });

                        currentMarker = L.marker([lat, lon], { icon: customIcon }).addTo(map);
                        currentMarker.bindPopup(`<b style="color:#0284c7;">LOCKED SECTOR: ${displayName}</b>`).openPopup();

                        document.getElementById('sys-time').innerText = "LOCK ACQUIRED";

                        // If Geo-Fence mode is active, place circle on target
                        if (activeMode === 'fence') {
                            if (currentCircle) map.removeLayer(currentCircle);
                            currentCircle = L.circle([lat, lon], {
                                color: '#ef4444',
                                fillColor: '#ef4444',
                                fillOpacity: 0.25,
                                radius: 4000
                            }).addTo(map);
                        }

                        // If Cell Towers mode is active, update nodes around target
                        if (activeMode === 'towers') {
                            updateTowersAt(lat, lon);
                        }

                    } else {
                        document.getElementById('sys-time').innerText = "SECTOR NOT FOUND";
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('sys-time').innerText = "UPLINK ERROR";
                });
        }

        document.getElementById('lock-btn').addEventListener('click', performLock);
        document.getElementById('target-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performLock();
        });

        // Mode Switchers
        document.getElementById('mode-sat').addEventListener('click', () => {
            activeMode = 'sat';
            document.getElementById('mode-sat').classList.add('active');
            document.getElementById('mode-towers').classList.remove('active');
            document.getElementById('mode-fence').classList.remove('active');
            clearTowers();
            if (currentCircle) { map.removeLayer(currentCircle); currentCircle = null; }
        });

        document.getElementById('mode-towers').addEventListener('click', () => {
            activeMode = 'towers';
            document.getElementById('mode-towers').classList.add('active');
            document.getElementById('mode-sat').classList.remove('active');
            document.getElementById('mode-fence').classList.remove('active');
            const center = map.getCenter();
            updateTowersAt(center.lat, center.lng);
        });

        document.getElementById('mode-fence').addEventListener('click', () => {
            activeMode = 'fence';
            document.getElementById('mode-fence').classList.add('active');
            document.getElementById('mode-sat').classList.remove('active');
            document.getElementById('mode-towers').classList.remove('active');
            clearTowers();
            const center = map.getCenter();
            if (currentCircle) map.removeLayer(currentCircle);
            currentCircle = L.circle(center, {
                color: '#ef4444',
                fillColor: '#ef4444',
                fillOpacity: 0.25,
                radius: 4000
            }).addTo(map);
        });

        function updateTowersAt(lat, lon) {
            clearTowers();
            const offsets = [[0.03, 0.03], [-0.03, -0.03], [0.04, -0.02], [-0.02, 0.04], [0.0, 0.05]];
            offsets.forEach(off => {
                const tLat = lat + off[0];
                const tLng = lon + off[1];
                const tMarker = L.circleMarker([tLat, tLng], {
                    color: '#f59e0b',
                    radius: 7,
                    fillColor: '#f59e0b',
                    fillOpacity: 0.9
                }).addTo(map).bindPopup("TACTICAL CELL NODE: ONLINE");
                towerLayers.push(tMarker);
            });
        }

        function clearTowers() {
            towerLayers.forEach(t => map.removeLayer(t));
            towerLayers = [];
        }
    </script>
</body>
</html>
