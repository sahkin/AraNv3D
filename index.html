<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionX // Enterprise Tactical Navigation</title>
    
    <!-- Fast Leaflet CSS CDN -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; color: #38bdf8; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Ultra-Clean Futuristic HUD Overlay */
        .hud-overlay {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 420px;
            background: rgba(3, 7, 18, 0.9); backdrop-filter: blur(12px);
            border: 1px solid #0284c7; border-radius: 8px; padding: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column; gap: 10px;
        }

        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(56, 189, 248, 0.2); padding-bottom: 8px;
        }
        .brand { font-size: 13px; font-weight: bold; letter-spacing: 2px; color: #38bdf8; }
        .live-status { font-size: 10px; color: #22c55e; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .pulse-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

        /* Control Actions */
        .action-row { display: flex; gap: 8px; }
        .tactical-input {
            flex: 1; background: #0f172a; border: 1px solid #1e293b; border-radius: 4px;
            padding: 10px; color: #fff; font-size: 13px; outline: none;
        }
        .tactical-input::placeholder { color: #64748b; }

        .tactical-btn {
            background: #0284c7; color: white; border: none; border-radius: 4px;
            padding: 10px 14px; font-weight: bold; font-size: 11px; cursor: pointer; letter-spacing: 1px;
            transition: background 0.2s;
        }
        .tactical-btn:active { background: #0369a1; }

        /* Telemetry Footer inside HUD */
        .telemetry-footer {
            display: flex; justify-content: space-between; font-size: 10px; color: #94a3b8;
            border-top: 1px solid rgba(255,255,255,0.05); padding-top: 6px;
        }
    </style>
</head>
<body>

    <!-- Map Engine Container -->
    <div id="map"></div>

    <!-- HUD Control Center -->
    <div class="hud-overlay">
        <div class="hud-header">
            <span class="brand">VISIONX // CORE_OS</span>
            <div class="live-status"><div class="pulse-dot"></div> GPS SECURED</div>
        </div>

        <div class="action-row">
            <input type="text" id="destination-input" class="tactical-input" placeholder="Enter target destination...">
            <button class="tactical-btn" id="locate-btn">MY GPS</button>
        </div>

        <div class="telemetry-footer">
            <span id="coords-display">LAT: --.-- | LNG: --.--</span>
            <span id="zoom-display">ZOOM: 16x</span>
        </div>
    </div>

    <!-- Fast Leaflet JS CDN -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. Initialize Map with hardware acceleration options
        const map = L.map('map', {
            zoomControl: false,
            fadeAnimation: true,
            zoomAnimation: true,
            markerZoomAnimation: true
        }).setView([34.1463, 73.2117], 16);

        // 2. High-Performance Satellite Tile Layer (Fast CDN, No lag)
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            updateWhenIdle: true,
            reuseTiles: true,
            attribution: 'VisionX Enterprise GIS'
        }).addTo(map);

        let userMarker = null;

        // 3. High-Precision Live GPS Detection
        function triggerGPS() {
            const btn = document.getElementById('locate-btn');
            btn.innerText = "locating...";

            if ("geolocation" in navigator) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;

                        // Instantly move map to exact real-world location without delay
                        map.setView([lat, lng], 18, { animate: true });

                        if (userMarker) {
                            userMarker.setLatLng([lat, lng]);
                        } else {
                            userMarker = L.circleMarker([lat, lng], {
                                radius: 8,
                                color: '#38bdf8',
                                fillColor: '#22c55e',
                                fillOpacity: 1,
                                weight: 2
                            }).addTo(map);
                        }

                        document.getElementById('coords-display').innerText = `LAT: ${lat.toFixed(4)} | LNG: ${lng.toFixed(4)}`;
                        btn.innerText = "MY GPS";
                    },
                    (error) => {
                        alert("GPS Signal Error: Please enable location permissions in your browser.");
                        btn.innerText = "MY GPS";
                    },
                    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
                );
            } else {
                alert("Geolocation is not supported by this browser.");
                btn.innerText = "MY GPS";
            }
        }

        document.getElementById('locate-btn').addEventListener('click', triggerGPS);

        // 4. Real-time telemetry updates during movement
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('coords-display').innerText = `LAT: ${center.lat.toFixed(4)} | LNG: ${center.lng.toFixed(4)}`;
            document.getElementById('zoom-display').innerText = `ZOOM: ${map.getZoom()}x`;
        });

        // Auto-trigger GPS on startup for instant lock
        window.addEventListener('load', () => {
            setTimeout(triggerGPS, 500);
        });
    </script>
</body>
</html>
