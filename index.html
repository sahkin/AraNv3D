<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionX // Enterprise Real Engine</title>
    
    <!-- Real Mapping & Routing Libraries -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, monospace; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; color: #f8fafc; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Glassmorphism Tactical HUD */
        .hud-container {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 450px;
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 12px; padding: 15px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            display: flex; flex-direction: column; gap: 12px;
        }

        .hud-header {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 8px;
        }
        .brand { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #38bdf8; }
        .status-tag { font-size: 10px; color: #22c55e; font-weight: 600; display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

        .search-group { display: flex; flex-direction: column; gap: 8px; }
        .input-box {
            width: 100%; background: rgba(2, 6, 23, 0.6); border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 6px; padding: 10px 12px; color: #38bdf8; font-size: 13px; outline: none;
        }
        .input-box::placeholder { color: #64748b; }

        .btn-primary {
            width: 100%; background: linear-gradient(135deg, #0284c7, #2563eb);
            border: none; border-radius: 6px; padding: 12px; color: #fff;
            font-size: 12px; font-weight: bold; letter-spacing: 1px; cursor: pointer; text-transform: uppercase;
        }
        .btn-primary:active { opacity: 0.9; }

        /* Real Data Telemetry Grid */
        .telemetry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tele-card {
            background: rgba(2, 6, 23, 0.4); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 6px; padding: 8px;
        }
        .tele-title { font-size: 9px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
        .tele-value { font-size: 12px; color: #38bdf8; font-weight: 700; margin-top: 2px; }

        /* Hide Default Ugly Routing Box */
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="hud-container">
        <div class="hud-header">
            <span class="brand">VISIONX // LIVE_ENGINE</span>
            <div class="status-tag"><div class="dot"></div> REALTIME GPS</div>
        </div>

        <div class="search-group">
            <input type="text" id="start-loc" class="input-box" placeholder="Start Point (e.g., Islamabad)">
            <input type="text" id="dest-loc" class="input-box" placeholder="Destination (e.g., Abbottabad)">
            <button class="btn-primary" id="route-btn">GENERATE REAL ROUTE</button>
        </div>

        <div class="telemetry-grid">
            <div class="tele-card">
                <div class="tele-title">CURRENT COORD</div>
                <div class="tele-value" id="coord-val">33.68, 73.04</div>
            </div>
            <div class="tele-card">
                <div class="tele-title">ZOOM LEVEL</div>
                <div class="tele-value" id="zoom-val">15x</div>
            </div>
        </div>
    </div>

    <!-- Engine Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>

    <script>
        // 1. Initialize Real Satellite Map
        const map = L.map('map', { zoomControl: false, minZoom: 2, maxZoom: 20 }).setView([33.6844, 73.0479], 15);

        // High-Precision Esri World Satellite Tiles
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 20,
            attribution: 'Esri Satellite Engine'
        }).addTo(map);

        // 2. Real Routing Controller
        let routingControl = L.Routing.control({
            waypoints: [],
            routeWhileDragging: true,
            lineOptions: { styles: [{ color: '#38bdf8', opacity: 0.9, weight: 6 }] }
        }).addTo(map);

        // Function to convert city name to real geographic coordinates (Geocoding API)
        async function getCoordinates(query) {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();
            if (data && data.length > 0) {
                return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
            }
            return null;
        }

        // 3. Action Event for Navigation
        document.getElementById('route-btn').addEventListener('click', async () => {
            const startStr = document.getElementById('start-loc').value.trim();
            const destStr = document.getElementById('dest-loc').value.trim();
            const btn = document.getElementById('route-btn');

            if (!startStr || !destStr) {
                alert("Please enter both start point and destination.");
                return;
            }

            btn.innerText = "SEARCHING REAL PATH...";

            const startCoords = await getCoordinates(startStr);
            const destCoords = await getCoordinates(destStr);

            if (startCoords && destCoords) {
                routingControl.setWaypoints([
                    L.latLng(startCoords[0], startCoords[1]),
                    L.latLng(destCoords[0], destCoords[1])
                ]);
                map.fitBounds([startCoords, destCoords]);
                btn.innerText = "ROUTE LOCKED";
                setTimeout(() => { btn.innerText = "GENERATE REAL ROUTE"; }, 3000);
            } else {
                alert("Could not locate one of the places on the map. Try another location.");
                btn.innerText = "GENERATE REAL ROUTE";
            }
        });

        // Live Telemetry Tracking
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('coord-val').innerText = `${center.lat.toFixed(2)}, ${center.lng.toFixed(2)}`;
            document.getElementById('zoom-val').innerText = `${map.getZoom()}x`;
        });
    </script>
</body>
</html>
