<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionX // Autonomous AI Traffic & Tactical Core</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Futuristic HUD Search Panel */
        .hud-panel {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 480px;
            background: rgba(3, 7, 18, 0.85); backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px;
            padding: 12px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .input-row { display: flex; align-items: center; gap: 8px; background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 6px 10px; }
        .input-row input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }
        .input-row input::placeholder { color: #64748b; }

        .action-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border: none;
            border-radius: 8px; padding: 10px; font-weight: bold; font-size: 11px;
            letter-spacing: 1px; cursor: pointer; text-transform: uppercase; transition: 0.3s;
        }
        .action-btn:hover { opacity: 0.9; transform: translateY(-1px); }

        /* AI Traffic Warning & Alert Box */
        .ai-alert-box {
            display: none; background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444;
            border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #fca5a5;
            animation: warningPulse 1.5s infinite;
        }
        @keyframes warningPulse { 0% { border-color: #ef4444; } 50% { border-color: #7f1d1d; } 100% { border-color: #ef4444; } }

        /* Side Tactical Floating Buttons */
        .side-menu {
            position: absolute; right: 20px; top: 50%; transform: translateY(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 12px;
        }

        .icon-btn {
            width: 44px; height: 44px; background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(12px); border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 12px; color: #38bdf8; display: flex; align-items: center;
            justify-content: center; font-size: 16px; cursor: pointer;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6); transition: 0.2s;
        }
        .icon-btn:active, .icon-btn.active { background: #0284c7; color: #fff; }

        /* AI Autonomous Neural Status Badge */
        .neural-badge {
            position: absolute; bottom: 25px; left: 20px; z-index: 1000;
            background: rgba(3, 7, 18, 0.9); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 14px; border-radius: 12px; font-size: 11px; color: #38bdf8;
            backdrop-filter: blur(15px); display: flex; flex-direction: column; gap: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .neural-status-row { display: flex; align-items: center; gap: 8px; font-weight: bold; }
        .neural-dot { width: 8px; height: 8px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 10px #22c55e; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Top Futuristic Control Center -->
    <div class="hud-panel">
        <div style="font-size: 10px; font-weight: bold; color: #38bdf8; letter-spacing: 2px; display: flex; justify-content: space-between;">
            <span>VISIONX // NEURAL TRAFFIC ENGINE</span>
            <span style="color: #22c55e;">ONLINE</span>
        </div>
        <div class="input-row">
            <i class="fa-solid fa-location-dot" style="color: #38bdf8; font-size: 12px;"></i>
            <input type="text" id="start-input" placeholder="Start Point (e.g. Islamabad)">
        </div>
        <div class="input-row">
            <i class="fa-solid fa-flag-checkered" style="color: #ef4444; font-size: 12px;"></i>
            <input type="text" id="dest-input" placeholder="Destination (e.g. Lahore)">
        </div>
        
        <div id="ai-alert" class="ai-alert-box">
            <i class="fa-solid fa-triangle-exclamation"></i> <span id="alert-text">AI DETECTED HEAVY CONGESTION. REROUTING...</span>
        </div>

        <button class="action-btn" id="calculate-btn">ENGAGE AI AUTONOMOUS ROUTE</button>
    </div>

    <!-- Side Floating Tools -->
    <div class="side-menu">
        <button class="icon-btn" id="ai-orbit-btn" title="AI Cinematic 360 Orbit"><i class="fa-solid fa-satellite-dish"></i></button>
        <button class="icon-btn" id="tilt-btn" title="Toggle 3D View"><i class="fa-solid fa-cube"></i></button>
        <button class="icon-btn" id="recenter-btn" title="Reset View"><i class="fa-solid fa-compass"></i></button>
    </div>

    <!-- Bottom Realtime Telemetry -->
    <div class="neural-badge">
        <div class="neural-status-row">
            <div class="neural-dot"></div> <span id="ai-state-txt">NEURAL CORE: STANDBY</span>
        </div>
        <div style="font-size: 10px; color: #94a3b8;" id="tele-txt">LAT: 33.6844 | LNG: 73.0479 | ZOOM: 12x</div>
    </div>

    <script>
        // 1. Initialize MapLibre 3D Satellite Globe
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'satellite': {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        maxzoom: 19
                    }
                },
                layers: [{
                    id: 'satellite-layer',
                    type: 'raster',
                    source: 'satellite',
                    minzoom: 0,
                    maxzoom: 19
                }]
            },
            center: [73.0479, 33.6844],
            zoom: 12,
            pitch: 50,
            bearing: 0
        });

        let currentPitch = 50;
        let isOrbiting = false;
        let orbitInterval = null;

        async function getCoordinates(query) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await res.json();
            if(data && data.length > 0) return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
            return null;
        }

        // 2. AI Autonomous Navigation & Smart Re-routing System
        document.getElementById('calculate-btn').addEventListener('click', async () => {
            const startStr = document.getElementById('start-input').value.trim();
            const destStr = document.getElementById('dest-input').value.trim();
            const btn = document.getElementById('calculate-btn');
            const alertBox = document.getElementById('ai-alert');

            if(!startStr || !destStr) {
                alert("Please enter both start and destination points.");
                return;
            }

            btn.innerText = "AI SCANNING SATELLITE & TRAFFIC...";
            document.getElementById('ai-state-txt').innerText = "NEURAL CORE: ANALYZING PATHS";
            alertBox.style.display = 'none';

            const start = await getCoordinates(startStr);
            const dest = await getCoordinates(destStr);

            if(!start || !dest) {
                alert("Locations could not be resolved.");
                btn.innerText = "ENGAGE AI AUTONOMOUS ROUTE";
                return;
            }

            // Fetch Primary Real Road Route from OSRM
            const primaryUrl = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(primaryUrl);
                const data = await res.json();

                if(!data.routes || data.routes.length === 0) {
                    alert("No route found.");
                    return;
                }

                const primaryGeometry = data.routes[0].geometry;

                // Cleanup existing layers
                if (map.getSource('route-src')) {
                    map.removeLayer('route-line');
                    map.removeSource('route-src');
                }
                if (map.getSource('alt-src')) {
                    map.removeLayer('alt-line');
                    map.removeSource('alt-src');
                }

                // Draw Primary Route (Cyan Line)
                map.addSource('route-src', { type: 'geojson', data: { type: 'Feature', geometry: primaryGeometry } });
                map.addLayer({
                    id: 'route-line', type: 'line', source: 'route-src',
                    layout: { 'line-join': 'round', 'line-cap': 'round' },
                    paint: { 'line-color': '#00f0ff', 'line-width': 6, 'line-opacity': 0.85 }
                });

                // --- AI INTELLIGENT TRAFFIC SIMULATION ---
                // AI simulates real-time traffic congestion on the primary route and automatically generates an alternative route!
                setTimeout(() => {
                    alertBox.style.display = 'block';
                    document.getElementById('ai-state-txt').innerText = "AI ALERT: CONGESTION DETECTED — REROUTING";
                    
                    // Slightly offset coordinates to simulate an intelligent alternative side-route/bypass
                    const altCoords = primaryGeometry.coordinates.map((coord, idx) => {
                        let offsetFactor = Math.sin(idx / 10) * 0.015;
                        return [coord[0] + offsetFactor, coord[1] + offsetFactor];
                    });

                    // Draw AI Alternative Bypass Route (Neon Green Dynamic Line)
                    map.addSource('alt-src', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'LineString', coordinates: altCoords } } });
                    map.addLayer({
                        id: 'alt-line', type: 'line', source: 'alt-src',
                        layout: { 'line-join': 'round', 'line-cap': 'round' },
                        paint: { 'line-color': '#22c55e', 'line-width': 6, 'line-dasharray': [2, 1], 'line-opacity': 0.9 }
                    });

                    document.getElementById('alert-text').innerText = "TRAFFIC JAM AT CHOWK! AI SWITCHED TO GREEN BYPASS ALTERNATIVE.";
                }, 2000);

                // Auto Fit Camera Bounds
                const coordinates = primaryGeometry.coordinates;
                const bounds = coordinates.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coordinates[0], coordinates[0]));
                map.fitBounds(bounds, { padding: 80, pitch: 55, duration: 3000 });

                btn.innerText = "AI ROUTE OPTIMIZED";
                setTimeout(() => { btn.innerText = "ENGAGE AI AUTONOMOUS ROUTE"; }, 4000);

            } catch (e) {
                alert("Routing calculation failed.");
                btn.innerText = "ENGAGE AI AUTONOMOUS ROUTE";
            }
        });

        // 3. AI Cinematic Orbit Control
        document.getElementById('ai-orbit-btn').addEventListener('click', () => {
            if(isOrbiting) {
                clearInterval(orbitInterval);
                isOrbiting = false;
                document.getElementById('ai-orbit-btn').classList.remove('active');
                document.getElementById('ai-state-txt').innerText = "NEURAL CORE: STANDBY";
            } else {
                isOrbiting = true;
                document.getElementById('ai-orbit-btn').classList.add('active');
                document.getElementById('ai-state-txt').innerText = "NEURAL CORE: 360° AI ORBIT ACTIVE";
                let bearing = map.getBearing();
                orbitInterval = setInterval(() => {
                    bearing += 0.6;
                    map.rotateTo(bearing, { duration: 100 });
                }, 100);
            }
        });

        document.getElementById('tilt-btn').addEventListener('click', () => {
            currentPitch = currentPitch === 0 ? 60 : 0;
            map.easeTo({ pitch: currentPitch, duration: 1000 });
        });

        document.getElementById('recenter-btn').addEventListener('click', () => {
            if(isOrbiting) {
                clearInterval(orbitInterval);
                isOrbiting = false;
                document.getElementById('ai-orbit-btn').classList.remove('active');
            }
            map.easeTo({ pitch: 50, bearing: 0, zoom: 12, duration: 1200 });
            document.getElementById('ai-state-txt').innerText = "NEURAL CORE: STANDBY";
        });

        // Telemetry Live Update
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('tele-txt').innerText = `LAT: ${center.lat.toFixed(4)} | LNG: ${center.lng.toFixed(4)} | ZOOM: ${map.getZoom().toFixed(1)}x`;
        });
    </script>
</body>
</html>
