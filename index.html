<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AraNv3D - Interactive Engine</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #020617; font-family: system-ui, -apple-system, sans-serif; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; filter: invert(100%) hue-rotate(180deg) brightness(95%) contrast(90%); }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; transition: opacity 0.3s; }

        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 24px;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.88); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px; padding: 20px 24px; pointer-events: auto;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9); color: #f8fafc;
        }
        
        .hud-header { display: flex; justify-content: space-between; align-items: center; }
        .label-glow { color: #38bdf8; font-size: 10px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
        .val-display { color: #ffffff; font-size: 26px; font-weight: 900; font-family: monospace; margin-top: 4px; }
        
        .pulse-indicator { width: 10px; height: 10px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 12px #22c55e; }
        
        .action-bar { display: flex; gap: 12px; margin: 0 auto; width: 100%; max-width: 480px; pointer-events: auto; }
        .action-btn {
            flex: 1; padding: 18px; border: none; border-radius: 16px; background: rgba(30, 41, 59, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.1); color: #38bdf8; font-weight: 800; font-size: 12px;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.3s;
        }
        .action-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div id="map"></div>
    <canvas id="ar-canvas"></canvas>

    <div class="hud-overlay">
        <div class="glass-card hud-header">
            <div>
                <div class="label-glow"><span class="pulse-indicator"></span>OPEN AI RADAR</div>
                <div style="color: #94a3b8; font-size: 12px; font-weight: 600; margin-top: 4px;">SYSTEM OPERATIONAL</div>
            </div>
            <div style="text-align: right;">
                <div class="label-glow">VELOCITY</div>
                <div class="val-display" id="speed-meter">0 KM/H</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="action-btn active" id="btn-3d">3D SPATIAL</button>
            <button class="action-btn" id="btn-ar">AR HUD</button>
        </div>
    </div>

    <script>
        // High-Performance Zero-Token Map Engine
        const map = L.map('map', { zoomControl: false }).setView([33.6844, 73.0479], 18);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: 'AraNv3D Engine'
        }).addTo(map);

        const userMarker = L.circleMarker([33.6844, 73.0479], {
            color: '#38bdf8',
            fillColor: '#0284c7',
            fillOpacity: 0.9,
            radius: 10
        }).addTo(map);

        // Auto Geolocation Sync
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((p) => {
                const lng = p.coords.longitude;
                const lat = p.coords.latitude;
                const speed = p.coords.speed ? Math.round(p.coords.speed * 3.6) : 0;
                
                document.getElementById('speed-meter').innerText = `${speed} KM/H`;
                map.setView([lat, lng], 18);
                userMarker.setLatLng([lat, lng]);
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }

        // Three.js AR Engine
        const canvas = document.getElementById('ar-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ringGeo = new THREE.RingGeometry(1.2, 1.5, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, side: THREE.DoubleSide, wireframe: true });
        const arRing = new THREE.Mesh(ringGeo, ringMat);
        arRing.position.z = -5;
        arRing.rotation.x = Math.PI / 3;
        scene.add(arRing);

        function renderLoop() {
            requestAnimationFrame(renderLoop);
            arRing.rotation.z += 0.015;
            renderer.render(scene, camera);
        }
        renderLoop();

        // Working Click Interactivity Logic
        const btn3d = document.getElementById('btn-3d');
        const btnAr = document.getElementById('btn-ar');

        btn3d.addEventListener('click', () => {
            btn3d.classList.add('active');
            btnAr.classList.remove('active');
            canvas.style.opacity = '0'; // Hide AR overlay for clean map view
        });

        btnAr.addEventListener('click', () => {
            btnAr.classList.add('active');
            btn3d.classList.remove('active');
            canvas.style.opacity = '1'; // Show AR HUD
        });
    </script>
</body>
</html>
