<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AegisX Sovereign Intelligence - Tactical Command Deck</title>
    
    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000205; font-family: 'Courier New', Courier, monospace; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Tactical HUD Layer */
        .hud-wrapper {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 12px;
        }
        
        .hud-top { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; width: 100%; max-width: 500px; margin: 0 auto; }

        .search-box {
            background: rgba(2, 6, 23, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 10px; padding: 8px 12px;
            display: flex; gap: 8px; box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }
        .search-field {
            flex: 1; background: transparent; border: none; outline: none; color: #38bdf8; font-size: 12px; font-weight: bold; font-family: monospace;
        }
        .search-field::placeholder { color: #334155; }
        
        .lock-action-btn {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); border: none; border-radius: 6px;
            padding: 0 14px; color: white; font-weight: bold; font-size: 9px; letter-spacing: 1px; cursor: pointer;
        }

        .telemetry-bar { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .tele-panel {
            background: rgba(2, 6, 23, 0.9); backdrop-filter: blur(15px);
            border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 8px; padding: 6px 10px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .tele-title { color: #38bdf8; font-size: 7px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }
        .tele-data { color: #ffffff; font-size: 11px; font-weight: bold; font-family: monospace; margin-top: 2px; }
        .active-dot { width: 5px; height: 5px; background: #22c55e; border-radius: 50%; display: inline-block; margin-right: 4px; box-shadow: 0 0 8px #22c55e; }

        /* Bottom Controls */
        .hud-bottom { display: flex; gap: 6px; pointer-events: auto; width: 100%; max-width: 400px; margin: 0 auto; }
        .nav-btn {
            flex: 1; padding: 10px 4px; border-radius: 8px; background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; font-weight: bold; font-size: 8px;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer; text-align: center;
        }
        .nav-btn.active {
            background: linear-gradient(135deg, #0284c7, #1d4ed8); color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-wrapper">
        <div class="hud-top">
            <div class="search-box">
                <input type="text" class="search-field" id="target-input" placeholder="ENTER LOCATION (e.g. London, Islamabad)...">
                <button class="lock-action-btn" id="lock-btn">LOCK</button>
            </div>

            <div class="telemetry-bar">
                <div class="tele-panel">
                    <div class="tele-title"><span class="active-dot"></span>SYSTEM STATUS</div>
                    <div class="tele-data" id="sys-status">ORBITAL LINK ONLINE</div>
                </div>
                <div class="tele-panel" style="text-align: right;">
                    <div class="tele-title">COORDINATES</div>
                    <div class="tele-data" id="coord-display">00.00, 00.00</div>
                </div>
            </div>
        </div>

        <div class="hud-bottom">
            <button class="nav-btn active" id="mode-globe">3D GLOBE</button>
            <button class="nav-btn" id="mode-towers">CELL TOWERS</button>
            <button class="nav-btn" id="mode-fence">GEO-FENCE</button>
        </div>
    </div>

    <script>
        // Three.js Core Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000205, 0.02);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.0;
        controls.minDistance = 6.0;
        controls.maxDistance = 25.0;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.5));
        const sunLight = new THREE.DirectionalLight(0x38bdf8, 2.0);
        sunLight.position.set(20, 20, 20);
        scene.add(sunLight);

        // Globe Mesh
        const radius = 5;
        const globeGeo = new THREE.SphereGeometry(radius, 64, 64);
        const textureLoader = new THREE.TextureLoader();
        const earthTex = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const globeMat = new THREE.MeshPhongMaterial({ map: earthTex, shininess: 15 });
        const globe = new THREE.Mesh(globeGeo, globeMat);
        scene.add(globe);

        // Atmosphere Glow
        const glowGeo = new THREE.SphereGeometry(radius * 1.03, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.12, side: THREE.BackSide });
        const glow = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glow);

        // Target Pin Group
        const targetGroup = new THREE.Group();
        const pinGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.6, 16);
        const pinMat = new THREE.MeshBasicMaterial({ color: 0x22c55e });
        const pin = new THREE.Mesh(pinGeo, pinMat);
        pin.position.y = 0.3;
        targetGroup.add(pin);

        const ringGeo = new THREE.RingGeometry(0.25, 0.3, 32);
        ringGeo.rotateX(Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        targetGroup.add(new THREE.Mesh(ringGeo, ringMat));
        targetGroup.visible = false;
        scene.add(targetGroup);

        // Towers Group
        const towersGroup = new THREE.Group();
        const towerGeo = new THREE.ConeGeometry(0.05, 0.25, 8);
        const towerMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
        const towerCoords = [
            {lat: 33.68, lon: 73.04}, {lat: 31.54, lon: 74.34}, 
            {lat: 24.86, lon: 67.00}, {lat: 51.50, lon: -0.12}, {lat: 40.71, lon: -74.00}
        ];
        const lineMat = new THREE.LineBasicMaterial({ color: 0xf59e0b, transparent: true, opacity: 0.3 });

        towerCoords.forEach(c => {
            const pos = getVector3FromLatLon(c.lat, c.lon, radius);
            const mesh = new THREE.Mesh(towerGeo, towerMat);
            mesh.position.copy(pos);
            mesh.lookAt(0, 0, 0);
            mesh.rotateX(Math.PI / 2);
            towersGroup.add(mesh);

            const points = [new THREE.Vector3(0,0,0), pos];
            const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), lineMat);
            towersGroup.add(line);
        });
        towersGroup.visible = false;
        scene.add(towersGroup);

        // Geo-Fence Shield
        const fenceGroup = new THREE.Group();
        const fenceGeo = new THREE.RingGeometry(0.6, 0.65, 32);
        fenceGeo.rotateX(Math.PI / 2);
        const fenceMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
        fenceGroup.add(new THREE.Mesh(fenceGeo, fenceMat));
        fenceGroup.visible = false;
        scene.add(fenceGroup);

        camera.position.set(0, 3, 14);
        controls.update();

        function getVector3FromLatLon(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(r * Math.sin(phi) * Math.cos(theta));
            const z = (r * Math.sin(phi) * Math.sin(theta));
            const y = (r * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // Search & Target Lock Execution
        function performLock() {
            const query = document.getElementById('target-input').value.trim();
            if (!query) return;

            document.getElementById('sys-status').innerText = "TRIANGULATING...";

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        document.getElementById('sys-status').innerText = `LOCKED: ${data[0].display_name.split(',')[0]}`;
                        document.getElementById('coord-display').innerText = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;

                        const pos = getVector3FromLatLon(lat, lon, radius);
                        targetGroup.position.copy(pos);
                        targetGroup.lookAt(0, 0, 0);
                        targetGroup.rotateX(Math.PI / 2);
                        targetGroup.visible = true;

                        fenceGroup.position.copy(pos);
                        fenceGroup.lookAt(0, 0, 0);

                        // Smooth transition camera zoom
                        const targetCamPos = getVector3FromLatLon(lat, lon, radius * 1.8);
                        let step = 0;
                        const maxSteps = 25;
                        const startPos = camera.position.clone();

                        function smoothZoom() {
                            if (step <= maxSteps) {
                                const t = step / maxSteps;
                                const ease = t * (2 - t);
                                camera.position.lerpVectors(startPos, targetCamPos, ease);
                                controls.update();
                                step++;
                                requestAnimationFrame(smoothZoom);
                            }
                        }
                        smoothZoom();
                    } else {
                        document.getElementById('sys-status').innerText = "SECTOR NOT FOUND";
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('sys-status').innerText = "UPLINK ERROR";
                });
        }

        document.getElementById('lock-btn').addEventListener('click', performLock);
        document.getElementById('target-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performLock();
        });

        // Mode Switching
        document.getElementById('mode-globe').addEventListener('click', () => {
            document.getElementById('mode-globe').classList.add('active');
            document.getElementById('mode-towers').classList.remove('active');
            document.getElementById('mode-fence').classList.remove('active');
            towersGroup.visible = false;
            fenceGroup.visible = false;
        });

        document.getElementById('mode-towers').addEventListener('click', () => {
            document.getElementById('mode-towers').classList.add('active');
            document.getElementById('mode-globe').classList.remove('active');
            document.getElementById('mode-fence').classList.remove('active');
            towersGroup.visible = true;
            document.getElementById('sys-status').innerText = "CELL TOWERS ACTIVE";
        });

        document.getElementById('mode-fence').addEventListener('click', () => {
            document.getElementById('mode-fence').classList.add('active');
            document.getElementById('mode-globe').classList.remove('active');
            document.getElementById('mode-towers').classList.remove('active');
            fenceGroup.visible = true;
            document.getElementById('sys-status').innerText = "GEO-FENCE ACTIVE";
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (!targetGroup.visible) {
                globe.rotation.y += 0.0003;
                glow.rotation.y += 0.0004;
                towersGroup.rotation.y += 0.0003;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
