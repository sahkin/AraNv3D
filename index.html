<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AegisX - Sovereign Military & Cellular Intelligence System</title>
    
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000206; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* HUD Overlay Interface */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 15px;
        }
        
        .top-panel { display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }

        .search-box-container {
            background: rgba(3, 7, 18, 0.96); backdrop-filter: blur(30px);
            border: 1px solid rgba(56, 189, 248, 0.8); border-radius: 14px; padding: 10px 14px;
            display: flex; gap: 10px; box-shadow: 0 25px 50px rgba(0,0,0,0.9);
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 14px; font-weight: 700;
        }
        .search-input::placeholder { color: #475569; }
        
        .search-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 10px;
            padding: 0 16px; color: white; font-weight: 900; font-size: 11px; letter-spacing: 1px; cursor: pointer;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.7);
        }

        .telemetry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

        .telemetry-card {
            background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.5); border-radius: 14px; padding: 10px 12px;
            color: #f8fafc; display: flex; flex-direction: column; justify-content: center;
        }
        
        .label-glow { color: #38bdf8; font-size: 8px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 0 8px rgba(56,189,248,0.6); }
        .val-display { color: #ffffff; font-size: 13px; font-weight: 900; font-family: monospace; margin-top: 2px; }
        .pulse-core { width: 6px; height: 6px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 10px #4ade80; animation: pulse 1s infinite; }
        
        @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(1.5); } 100% { opacity: 1; transform: scale(1); } }

        /* Tactical Radar Widget */
        .radar-box {
            position: absolute; bottom: 80px; right: 15px; width: 105px; height: 105px;
            background: rgba(3, 7, 18, 0.88); border: 1px solid rgba(56, 189, 248, 0.6); border-radius: 50%;
            pointer-events: none; z-index: 10; display: flex; align-items: center; justify-content: center;
            overflow: hidden; box-shadow: 0 0 30px rgba(2,132,199,0.5);
        }
        .radar-sweep {
            position: absolute; width: 100%; height: 100%; border-radius: 50%;
            background: conic-gradient(from 0deg at 50% 50%, rgba(56, 189, 248, 0) 0deg, rgba(56, 189, 248, 0.7) 360deg);
            animation: rotateRadar 2s linear infinite;
        }
        @keyframes rotateRadar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .radar-center { width: 4px; height: 4px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 10px #4ade80; z-index: 2; }
        .radar-blip {
            position: absolute; width: 5px; height: 5px; background: #ef4444; border-radius: 50%;
            box-shadow: 0 0 8px #ef4444; top: 30px; left: 65px; animation: blipPulse 1.5s infinite;
        }
        @keyframes blipPulse { 0% { opacity: 0.2; } 50% { opacity: 1; } 100% { opacity: 0.2; } }

        .control-bar { display: flex; gap: 8px; pointer-events: auto; width: 100%; max-width: 420px; margin: 0 auto; }
        .quantum-btn {
            flex: 1; padding: 12px; border: none; border-radius: 12px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8; font-weight: 900; font-size: 9px;
            letter-spacing: 1px; text-transform: uppercase; cursor: pointer;
        }
        .quantum-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 0 25px rgba(56, 189, 248, 0.7);
        }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="radar-box">
        <div class="radar-sweep"></div>
        <div class="radar-blip"></div>
        <div class="radar-center"></div>
    </div>

    <div class="hud-overlay">
        <div class="top-panel">
            <div class="search-box-container">
                <input type="text" class="search-input" id="global-search" placeholder="Enter target city or sector (e.g. Islamabad)...">
                <button class="search-btn" id="exec-btn">LOCK</button>
            </div>

            <div class="telemetry-grid">
                <div class="telemetry-card">
                    <div class="label-glow"><span class="pulse-core"></span>TOWER & GEO-FENCE</div>
                    <div class="val-display" id="status-display" style="font-size: 10px; color: #38bdf8;">5G MATRIX LINKED</div>
                </div>
                <div class="telemetry-card" style="text-align: right;">
                    <div class="label-glow">EXACT COORDS</div>
                    <div class="val-display" id="coords-val" style="font-size: 11px;">00.0000, 00.0000</div>
                </div>
            </div>
        </div>

        <div class="control-bar">
            <button class="quantum-btn active" id="btn-globe">3D SATELLITE GLOBE</button>
            <button class="quantum-btn" id="btn-towers">CELL TOWERS MATRIX</button>
            <button class="quantum-btn" id="btn-fencing">GEO-FENCE ZONE</button>
        </div>
    </div>

    <script>
        // High-Precision Sovereign 3D Engine
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000206, 0.02);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.rotateSpeed = 0.8;
        controls.zoomSpeed = 1.2;
        controls.minDistance = 5.2;
        controls.maxDistance = 35;

        // Lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.8));
        const sunLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
        sunLight.position.set(30, 30, 30);
        scene.add(sunLight);

        // Earth Globe Creation
        const radius = 5;
        const sphereGeo = new THREE.SphereGeometry(radius, 64, 64);
        
        const textureLoader = new THREE.TextureLoader();
        const earthTexture = textureLoader.load('https://unpkg.com/three-globe/example/img/earth-blue-marble.jpg');
        
        const sphereMat = new THREE.MeshPhongMaterial({
            map: earthTexture,
            shininess: 25
        });
        const earthSphere = new THREE.Mesh(sphereGeo, sphereMat);
        scene.add(earthSphere);

        // Atmosphere Glow Layer
        const glowGeo = new THREE.SphereGeometry(radius * 1.06, 32, 32);
        const glowMat = new THREE.MeshBasicMaterial({
            color: 0x38bdf8,
            transparent: true,
            opacity: 0.18,
            side: THREE.BackSide
        });
        const glowSphere = new THREE.Mesh(glowGeo, glowMat);
        scene.add(glowSphere);

        // Target Marker Group (Precision Pin & Radar Ring)
        const targetGroup = new THREE.Group();
        const pinGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.9, 16);
        const pinMat = new THREE.MeshBasicMaterial({ color: 0x4ade80 });
        const pinMesh = new THREE.Mesh(pinGeo, pinMat);
        pinMesh.position.y = 0.45;
        targetGroup.add(pinMesh);

        const ringGeo = new THREE.RingGeometry(0.25, 0.3, 32);
        ringGeo.rotateX(Math.PI / 2);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        targetGroup.add(ringMesh);
        targetGroup.visible = false;
        scene.add(targetGroup);

        // Cellular Tower Nodes Group (Simulated Telecom Infrastructure)
        const towersGroup = new THREE.Group();
        const towerGeo = new THREE.ConeGeometry(0.08, 0.4, 8);
        const towerMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b }); // Amber tower nodes
        
        // Scatter sample telecom tower coordinates on globe
        const towerCoords = [
            {lat: 33.6844, lon: 73.0479}, // Islamabad
            {lat: 31.5497, lon: 74.3436}, // Lahore
            {lat: 24.8607, lon: 67.0011}, // Karachi
            {lat: 51.5074, lon: -0.1278}, // London
            {lat: 40.7128, lon: -74.0060}  // New York
        ];

        towerCoords.forEach(coord => {
            const pos = getVector3FromLatLon(coord.lat, coord.lon, radius);
            const tower = new THREE.Mesh(towerGeo, towerMat);
            tower.position.copy(pos);
            tower.lookAt(0, 0, 0);
            tower.rotateX(Math.PI / 2);
            towersGroup.add(tower);
        });
        towersGroup.visible = false;
        scene.add(towersGroup);

        // Geo-Fencing Security Zone (Pulsing Shield Ring)
        const fenceGroup = new THREE.Group();
        const fenceGeo = new THREE.RingGeometry(0.8, 0.85, 64);
        fenceGeo.rotateX(Math.PI / 2);
        const fenceMat = new THREE.MeshBasicMaterial({ color: 0xef4444, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
        const fenceMesh = new THREE.Mesh(fenceGeo, fenceMat);
        fenceGroup.add(fenceMesh);
        fenceGroup.visible = false;
        scene.add(fenceGroup);

        camera.position.set(0, 4, 15);
        controls.update();

        function getVector3FromLatLon(lat, lon, r) {
            const phi = (90 - lat) * (Math.PI / 180);
            const theta = (lon + 180) * (Math.PI / 180);
            const x = -(r * Math.sin(phi) * Math.cos(theta));
            const z = (r * Math.sin(phi) * Math.sin(theta));
            const y = (r * Math.cos(phi));
            return new THREE.Vector3(x, y, z);
        }

        // Target Lock & Geocoding Engine
        function executeTargetLock() {
            const query = document.getElementById('global-search').value.trim();
            if (!query) return;

            document.getElementById('status-display').innerText = `TRIANGULATING SATELLITE...`;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(res => res.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);

                        document.getElementById('status-display').innerText = `LOCKED: ${data[0].display_name.split(',')[0]}`;
                        document.getElementById('coords-val').innerText = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;

                        const pos = getVector3FromLatLon(lat, lon, radius);
                        targetGroup.position.copy(pos);
                        targetGroup.lookAt(0, 0, 0);
                        targetGroup.rotateX(Math.PI / 2);
                        targetGroup.visible = true;

                        // Position geo-fence shield over target
                        fenceGroup.position.copy(pos);
                        fenceGroup.lookAt(0, 0, 0);

                        // Smooth camera transition to target coordinates
                        const targetCamPos = getVector3FromLatLon(lat, lon, radius * 1.7);
                        let step = 0;
                        const maxSteps = 35;
                        const startPos = camera.position.clone();

                        function smoothZoom() {
                            if (step <= maxSteps) {
                                const t = step / maxSteps;
                                const ease = t * (2 - t);
                                camera.position.lerpVectors(startPos, targetCamPos, ease);
                                controls.update();
                                step++;
                                requestAnimationFrame(smoothZoom);
                            }
                        }
                        smoothZoom();

                    } else {
                        document.getElementById('status-display').innerText = `SECTOR NOT FOUND`;
                    }
                })
                .catch(err => console.error(err));
        }

        document.getElementById('exec-btn').addEventListener('click', executeTargetLock);
        document.getElementById('global-search').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') executeTargetLock();
        });

        // Mode Switchers for Towers & Geo-Fencing
        document.getElementById('btn-globe').addEventListener('click', () => {
            document.getElementById('btn-globe').classList.add('active');
            document.getElementById('btn-towers').classList.remove('active');
            document.getElementById('btn-fencing').classList.remove('active');
            towersGroup.visible = false;
            fenceGroup.visible = false;
            earthSphere.visible = true;
        });

        document.getElementById('btn-towers').addEventListener('click', () => {
            document.getElementById('btn-towers').classList.add('active');
            document.getElementById('btn-globe').classList.remove('active');
            document.getElementById('btn-fencing').classList.remove('active');
            towersGroup.visible = true;
            document.getElementById('status-display').innerText = `CELL TOWERS MATRIX ACTIVE`;
        });

        document.getElementById('btn-fencing').addEventListener('click', () => {
            document.getElementById('btn-fencing').classList.add('active');
            document.getElementById('btn-globe').classList.remove('active');
            document.getElementById('btn-towers').classList.remove('active');
            fenceGroup.visible = true;
            document.getElementById('status-display').innerText = `GEO-FENCE SECURITY ENGAGED`;
        });

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            if (!targetGroup.visible) {
                earthSphere.rotation.y += 0.0004;
                glowSphere.rotation.y += 0.0005;
                towersGroup.rotation.y += 0.0004;
            }
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
