<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VisionX // True-Road Navigation Engine</title>
    
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; color: #fff; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Clean Minimalist HUD Panel */
        .hud-panel {
            position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
            z-index: 1000; width: 92%; max-width: 420px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 14px;
            padding: 12px; display: flex; flex-direction: column; gap: 8px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.8);
        }

        .input-box {
            display: flex; align-items: center; gap: 8px; background: rgba(2, 6, 23, 0.8);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; padding: 8px 10px;
        }
        .input-box input { flex: 1; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; }
        .input-box input::placeholder { color: #64748b; }

        .btn-engage {
            background: #0284c7; color: #fff; border: none; border-radius: 8px;
            padding: 10px; font-weight: bold; font-size: 11px; letter-spacing: 1px;
            cursor: pointer; text-transform: uppercase; transition: 0.2s;
        }
        .btn-engage:active { background: #0369a1; }

        /* Floating Side Menu */
        .side-menu {
            position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
            z-index: 1000; display: flex; flex-direction: column; gap: 10px;
        }
        .icon-btn {
            width: 42px; height: 42px; background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(10px); border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 10px; color: #38bdf8; display: flex; align-items: center;
            justify-content: center; font-size: 15px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        .icon-btn:active { background: #0284c7; color: #fff; }

        /* Telemetry Status Bar */
        .telemetry-bar {
            position: absolute; bottom: 20px; left: 15px; z-index: 1000;
            background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 8px 12px; border-radius: 8px; font-size: 10px; color: #38bdf8;
            backdrop-filter: blur(10px); font-weight: 600;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Top UI Search Box -->
    <div class="hud-panel">
        <div style="font-size: 10px; font-weight: bold; color: #38bdf8; letter-spacing: 1px; display: flex; justify-content: space-between;">
            <span>VISIONX // TRUE-ROAD ENGINE</span>
            <span style="color: #22c55e;">● ACTIVE</span>
        </div>
        <div class="input-box">
            <i class="fa-solid fa-circle-dot" style="color: #38bdf8; font-size: 11px;"></i>
            <input type="text" id="start-loc" placeholder="Start Point (e.g. Abbottabad)">
        </div>
        <div class="input-box">
            <i class="fa-solid fa-location-dot" style="color: #ef4444; font-size: 11px;"></i>
            <input type="text" id="dest-loc" placeholder="Destination (e.g. Balakot)">
        </div>
        <button class="btn-engage" id="route-btn">CALCULATE REAL ROAD ROUTE</button>
    </div>

    <!-- Side Tools -->
    <div class="side-menu">
        <button class="icon-btn" id="tilt-btn" title="Toggle 3D"><i class="fa-solid fa-cube"></i></button>
        <button class="icon-btn" id="reset-btn" title="Reset View"><i class="fa-solid fa-compass"></i></button>
    </div>

    <!-- Bottom Telemetry -->
    <div class="telemetry-bar" id="tele-box">
        LAT: 34.2182 | LNG: 73.2399 | ZOOM: 13.7x
    </div>

    <script>
        // 1. Initialize MapLibre 3D Satellite Globe
        const map = new maplibregl.Map({
            container: 'map',
            style: {
                version: 8,
                sources: {
                    'satellite': {
                        type: 'raster',
                        tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
                        tileSize: 256,
                        maxzoom: 19
                    }
                },
                layers: [{
                    id: 'satellite-layer',
                    type: 'raster',
                    source: 'satellite',
                    minzoom: 0,
                    maxzoom: 19
                }]
            },
            center: [73.2399, 34.2182], // Abbottabad coordinates
            zoom: 13,
            pitch: 45,
            bearing: 0
        });

        let currentPitch = 45;

        async function fetchCoords(place) {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(place)}`);
            const data = await res.json();
            if(data && data.length > 0) return [parseFloat(data[0].lon), parseFloat(data[0].lat)];
            return null;
        }

        // 2. Real Road Routing via OSRM Engine
        document.getElementById('route-btn').addEventListener('click', async () => {
            const startStr = document.getElementById('start-loc').value.trim();
            const destStr = document.getElementById('dest-loc').value.trim();
            const btn = document.getElementById('route-btn');

            if(!startStr || !destStr) {
                alert("Please enter both locations.");
                return;
            }

            btn.innerText = "CALCULATING ROAD NETWORK...";

            const start = await fetchCoords(startStr);
            const dest = await fetchCoords(destStr);

            if(!start || !dest) {
                alert("Could not locate places on the map.");
                btn.innerText = "CALCULATE REAL ROAD ROUTE";
                return;
            }

            // Fetch actual road geometry from Open Source Routing Machine
            const url = `https://router.project-osrm.org/route/v1/driving/${start[0]},${start[1]};${dest[0]},${dest[1]}?overview=full&geometries=geojson`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if(!data.routes || data.routes.length === 0) {
                    alert("No driving route available between these points.");
                    return;
                }

                const geometry = data.routes[0].geometry;

                // Remove old route if exists
                if (map.getSource('route')) {
                    map.removeLayer('route-line');
                    map.removeSource('route');
                }

                // Add Real Road Polyline
                map.addSource('route', {
                    type: 'geojson',
                    data: {
                        type: 'Feature',
                        geometry: geometry
                    }
                });

                map.addLayer({
                    id: 'route-line',
                    type: 'line',
                    source: 'route',
                    layout: {
                        'line-join': 'round',
                        'line-cap': 'round'
                    },
                    paint: {
                        'line-color': '#00f0ff',
                        'line-width': 6,
                        'line-opacity': 0.9
                    }
                });

                // Fit camera smoothly along the actual road bounds
                const coords = geometry.coordinates;
                const bounds = coords.reduce((b, coord) => b.extend(coord), new maplibregl.LngLatBounds(coords[0], coords[0]));
                map.fitBounds(bounds, { padding: 60, pitch: 50, duration: 2500 });

                btn.innerText = "ROUTE LOCKED ON ROAD";
                setTimeout(() => { btn.innerText = "CALCULATE REAL ROAD ROUTE"; }, 3000);

            } catch (err) {
                alert("Routing connection error.");
                btn.innerText = "CALCULATE REAL ROAD ROUTE";
            }
        });

        // UI Controls
        document.getElementById('tilt-btn').addEventListener('click', () => {
            currentPitch = currentPitch === 0 ? 55 : 0;
            map.easeTo({ pitch: currentPitch, duration: 1000 });
        });

        document.getElementById('reset-btn').addEventListener('click', () => {
            map.easeTo({ pitch: 45, bearing: 0, zoom: 13, duration: 1000 });
        });

        // Telemetry Update
        map.on('move', () => {
            const center = map.getCenter();
            document.getElementById('tele-box').innerText = `LAT: ${center.lat.toFixed(4)} | LNG: ${center.lng.toFixed(4)} | ZOOM: ${map.getZoom().toFixed(1)}x`;
        });
    </script>
</body>
</html>
