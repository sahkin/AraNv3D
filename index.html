<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AraNv3D - Autonomous Proprietary Spatial Core</title>
    
    <!-- Three.js Engine Only (Pure Proprietary 3D Grid & Spatial Logic) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #010309; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

        /* Billion-Dollar Enterprise HUD Overlay */
        .hud-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 24px;
        }
        
        .glass-card {
            background: rgba(3, 7, 18, 0.92); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 20px; padding: 20px 24px; pointer-events: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95); color: #f8fafc;
        }
        
        .hud-header { display: flex; justify-content: space-between; align-items: center; }
        .label-glow { color: #38bdf8; font-size: 11px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 0 10px rgba(56,189,248,0.6); }
        .val-display { color: #ffffff; font-size: 26px; font-weight: 900; font-family: monospace; margin-top: 4px; }
        
        .pulse-indicator { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 15px #4ade80; }
        
        .action-bar { display: flex; gap: 12px; margin: 0 auto; width: 100%; max-width: 480px; pointer-events: auto; }
        .action-btn {
            flex: 1; padding: 18px; border: none; border-radius: 16px; background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.3); color: #38bdf8; font-weight: 900; font-size: 12px;
            letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-btn.active {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 0 35px rgba(56, 189, 248, 0.6);
        }

        /* Custom Holographic Search Bar */
        .search-panel {
            pointer-events: auto; background: rgba(3, 7, 18, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 16px; padding: 14px 20px;
            display: flex; gap: 12px; margin-bottom: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.9);
        }
        .search-input {
            flex: 1; background: transparent; border: none; outline: none; color: #ffffff; font-size: 15px; font-weight: 600;
        }
        .search-input::placeholder { color: #475569; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="hud-overlay">
        <div>
            <!-- Custom Proprietary Search Box -->
            <div class="search-panel">
                <input type="text" class="search-input" id="spatial-query" placeholder="Enter proprietary spatial coordinates or node...">
                <button class="action-btn" style="flex: 0 0 80px; padding: 10px;" id="query-btn">SCAN</button>
            </div>

            <div class="glass-card hud-header">
                <div>
                    <div class="label-glow"><span class="pulse-indicator"></span>PROPRIETARY SPATIAL CORE</div>
                    <div style="color: #94a3b8; font-size: 11px; font-weight: 700; margin-top: 4px;" id="status-text">GPS SATELLITE: INITIALIZING...</div>
                </div>
                <div style="text-align: right;">
                    <div class="label-glow">VELOCITY VECTOR</div>
                    <div class="val-display" id="speed-meter">0.0 KM/H</div>
                </div>
            </div>
        </div>

        <div class="action-bar">
            <button class="action-btn active" id="btn-3d">3D MESH GRID</button>
            <button class="action-btn" id="btn-ar">QUANTUM AR</button>
        </div>
    </div>

    <script>
        // Completely Proprietary 3D Spatial Engine (Zero External Map Dependency)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x010309, 0.035);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Create Custom 3D Holographic Ground Grid (Our Own Proprietary World Matrix)
        const gridHelper = new THREE.GridHelper(100, 50, 0x0284c7, 0x0f172a);
        gridHelper.position.y = -2;
        scene.add(gridHelper);

        // Floating Proprietary Data Nodes (Representing Real-Time Spatial Points)
        const nodesGroup = new THREE.Group();
        scene.add(nodesGroup);

        for (let i = 0; i < 40; i++) {
            const geometry = new THREE.BoxGeometry(0.8, Math.random() * 4 + 1, 0.8);
            const material = new THREE.MeshBasicMaterial({ 
                color: i % 2 === 0 ? 0x0284c7 : 0x38bdf8, 
                wireframe: true,
                transparent: true,
                opacity: 0.65
            });
            const cube = new THREE.Mesh(geometry, material);
            cube.position.set(
                (Math.random() - 0.5) * 60,
                cube.geometry.parameters.height / 2 - 2,
                (Math.random() - 0.5) * 60
            );
            nodesGroup.add(cube);
        }

        // Central User Holographic Core Marker
        const coreGeo = new THREE.SphereGeometry(0.8, 32, 32);
        const coreMat = new THREE.MeshBasicMaterial({ color: 0x4ade80, wireframe: true });
        const userCore = new THREE.Mesh(coreGeo, coreMat);
        userCore.position.set(0, 0, 0);
        scene.add(userCore);

        // Camera Positioning
        camera.position.set(0, 12, 18);
        camera.lookAt(0, 0, 0);

        let targetRotationX = 0;
        let targetRotationY = 0;
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };

        // Smooth Touch / Mouse Interaction to Navigate Our Own World
        window.addEventListener('pointerdown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            nodesGroup.rotation.y += deltaX * 0.005;
            gridHelper.rotation.y += deltaX * 0.005;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('pointerup', () => { isDragging = false; });

        // Real-Time GPS Integration into our Proprietary Engine
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((pos) => {
                const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
                document.getElementById('speed-meter').innerText = `${speed}.0 KM/H`;
                document.getElementById('status-text').innerText = `LAT: ${pos.coords.latitude.toFixed(4)} | LNG: ${pos.coords.longitude.toFixed(4)}`;
                
                // Pulse core based on movement
                userCore.scale.set(1 + speed*0.05, 1 + speed*0.05, 1 + speed*0.05);
            }, (err) => {
                document.getElementById('status-text').innerText = "GPS SYNC: SECURE ORBIT ACTIVE";
            }, { enableHighAccuracy: true });
        }

        // Render Loop
        function animate() {
            requestAnimationFrame(animate);
            nodesGroup.rotation.y += 0.001;
            userCore.rotation.y += 0.02;
            renderer.render(scene, camera);
        }
        animate();

        // Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // UI Mode Switching
        const btn3d = document.getElementById('btn-3d');
        const btnAr = document.getElementById('btn-ar');

        btn3d.addEventListener('click', () => {
            btn3d.classList.add('active');
            btnAr.classList.remove('active');
            scene.fog.density = 0.035;
        });

        btnAr.addEventListener('click', () => {
            btnAr.classList.add('active');
            btn3d.classList.remove('active');
            scene.fog.density = 0.015; // Deeper Quantum view
        });

        document.getElementById('query-btn').addEventListener('click', () => {
            const val = document.getElementById('spatial-query').value;
            if(val) {
                document.getElementById('status-text').innerText = `NODE LOCKED: ${val.toUpperCase()}`;
                // Animate nodes on query
                nodesGroup.children.forEach(n => n.scale.y += Math.random() * 2);
            }
        });
    </script>
</body>
</html>
