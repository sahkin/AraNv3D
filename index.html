<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AraNv3D - Enterprise Global Spatial Engine</title>
    
    <!-- Leaflet & Search Geocoder CSS/JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-control-geocoder/dist/Control.Geocoder.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #030712; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        #map { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; background: #030712; }
        #ar-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; transition: opacity 0.3s ease; }

        /* Professional Google-Style Search Bar UI */
        .search-container {
            position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1000;
            display: flex; gap: 10px; pointer-events: auto;
        }
        .search-input {
            flex: 1; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.4); border-radius: 14px; padding: 16px 20px;
            color: #ffffff; font-size: 15px; outline: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .search-input::placeholder { color: #64748b; }
        .search-btn {
            background: linear-gradient(135deg, #0284c7, #2563eb); border: none; border-radius: 14px;
            padding: 0 20px; color: white; font-weight: 800; font-size: 13px; cursor: pointer;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
        }

        /* HUD Bottom Panel */
        .hud-overlay {
            position: absolute; bottom: 30px; left: 20px; right: 20px; z-index: 10;
            pointer-events: none; display: flex; flex-direction: column; gap: 12px;
        }
        
        .glass-card {
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 18px; padding: 16px 20px; pointer-events: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.85); color: #f8fafc; display: flex; justify-content: space-between; align-items: center;
        }
        
        .label-glow { color: #38bdf8; font-size: 10px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
        .val-display { color: #ffffff; font-size: 22px; font-weight: 900; font-family: monospace; }
        .pulse-dot { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; display: inline-block; margin-right: 6px; box-shadow: 0 0 10px #4ade80; }

        .action-bar { display: flex; gap: 10px; pointer-events: auto; }
        .action-btn {
            flex: 1; padding: 14px; border: none; border-radius: 14px; background: rgba(30, 41, 59, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.15); color: #38bdf8; font-weight: 800; font-size: 11px;
            letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s;
        }
        .action-btn.active { background: linear-gradient(135deg, #0284c7, #2563eb); color: #fff; border-color: #38bdf8; box-shadow: 0 0 20px rgba(56,189,248,0.4); }
    </style>
</head>
<body>

    <!-- Google-Style Global Search Bar -->
    <div class="search-container">
        <input type="text" id="search-box" class="search-input" placeholder="Search places, addresses, or coordinates..." />
        <button id="search-submit" class="search-btn">GO</button>
    </div>

    <div id="map"></div>
    <canvas id="ar-canvas"></canvas>

    <div class="hud-overlay">
        <div class="glass-card">
            <div>
                <div class="label-glow"><span class="pulse-dot"></span>GLOBAL SPATIAL ENGINE</div>
                <div style="color: #94a3b8; font-size: 11px; margin-top: 2px;">LIVE VECTOR STREAM</div>
            </div>
            <div style="text-align: right;">
                <div class="label-glow">VELOCITY</div>
                <div class="val-display" id="speed-meter">0 KM/H</div>
            </div>
        </div>

        <div class="action-bar">
            <button class="action-btn active" id="btn-3d">3D SPATIAL</button>
            <button class="action-btn" id="btn-ar">AR HUD</button>
        </div>
    </div>

    <script>
        // Initialize Premium Enterprise Map (Zero Broken Tiles, Full Touch & Zoom)
        const map = L.map('map', {
            zoomControl: false,
            dragging: true,
            touchZoom: true,
            scrollWheelZoom: true,
            doubleClickZoom: true
        }).setView([33.6844, 73.0479], 17);

        // High-End CartoDB Dark Matter Basemap (Clean corporate look like Google/Apple)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            maxZoom: 20,
            minZoom: 2,
            subdomains: 'abcd',
            attribution: '&copy; AraNv3D Enterprise Core'
        }).addTo(map);

        // User Live GPS Marker
        const userMarker = L.circleMarker([33.6844, 73.0479], {
            color: '#0284c7',
            fillColor: '#38bdf8',
            fillOpacity: 0.9,
            radius: 10,
            weight: 3
        }).addTo(map);

        let isLocked = false;

        // Autonomous Geolocation Live Tracker
        if ('geolocation' in navigator) {
            navigator.geolocation.watchPosition((p) => {
                const lat = p.coords.latitude;
                const lng = p.coords.longitude;
                const speed = p.coords.speed ? Math.round(p.coords.speed * 3.6) : 0;
                
                document.getElementById('speed-meter').innerText = `${speed} KM/H`;
                userMarker.setLatLng([lat, lng]);

                if (!isLocked) {
                    map.setView([lat, lng], 18);
                    isLocked = true;
                }
            }, (err) => console.log(err), { enableHighAccuracy: true });
        }

        // Live Search Bar Implementation (Google Style Geocoding)
        const searchInput = document.getElementById('search-box');
        const searchSubmit = document.getElementById('search-submit');

        function performSearch() {
            const query = searchInput.value.trim();
            if (!query) return;

            fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        const lat = parseFloat(data[0].lat);
                        const lon = parseFloat(data[0].lon);
                        map.setView([lat, lon], 17);
                        L.marker([lat, lon]).addTo(map).bindPopup(query).openPopup();
                    } else {
                        alert('Location not found in global index.');
                    }
                })
                .catch(err => console.error('Search error:', err));
        }

        searchSubmit.addEventListener('click', performSearch);
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        // Three.js AR Overlay
        const canvas = document.getElementById('ar-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        const ringGeo = new THREE.RingGeometry(1.2, 1.5, 64);
        const ringMat = new THREE.MeshBasicMaterial({ color: 0x0284c7, side: THREE.DoubleSide, wireframe: true });
        const arRing = new THREE.Mesh(ringGeo, ringMat);
        arRing.position.z = -5;
        arRing.rotation.x = Math.PI / 3;
        scene.add(arRing);

        function animate() {
            requestAnimationFrame(animate);
            arRing.rotation.z += 0.015;
            renderer.render(scene, camera);
        }
        animate();

        // UI Mode Toggles
        const btn3d = document.getElementById('btn-3d');
        const btnAr = document.getElementById('btn-ar');

        btn3d.addEventListener('click', () => {
            btn3d.classList.add('active');
            btnAr.classList.remove('active');
            canvas.style.opacity = '0';
        });

        btnAr.addEventListener('click', () => {
            btnAr.classList.add('active');
            btn3d.classList.remove('active');
            canvas.style.opacity = '1';
        });
    </script>
</body>
</html>
